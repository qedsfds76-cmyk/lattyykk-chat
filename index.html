<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>L-Chat</title>
<style>
:root{--bg:#0d0f15;--rail:#11131b;--panel:#171a24;--panel2:#1e2230;--panel3:#292e40;--line:#343b50;--text:#f3f5fb;--muted:#9299aa;--accent:#8c6dff;--good:#4ed39b;--danger:#f07191}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0d0f15!important;color:#f3f5fb!important;font:14px/1.4 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.96)}.app{height:100vh;height:100dvh;display:grid;grid-template-columns:72px 255px minmax(400px,1fr) 235px;background:#0d0f15}.rail{background:#11131b;border-right:1px solid #ffffff0d;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px}.brand,.server{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);color:#d6ceff;font-weight:900}.brand{background:linear-gradient(145deg,var(--accent),#3b62dd);color:white;font-size:22px;box-shadow:0 10px 25px #765dff44}.server{border-radius:50%;font-size:15px}.server:hover,.server.active{background:var(--accent);color:#fff;border-radius:15px}.rail hr{width:34px;border:0;border-top:1px solid var(--line)}.rail-spacer{flex:1}.channels{background:#171a24;border-right:1px solid #ffffff0d;padding:18px 12px;display:flex;flex-direction:column;min-width:0;overflow-y:auto}.workspace{display:flex;justify-content:space-between;padding:0 9px 20px;font-size:13px;font-weight:900;letter-spacing:.1em}.workspace button,.profile-actions button,.top-actions button{background:transparent;color:var(--muted);padding:7px;border-radius:8px}.workspace button:hover,.profile-actions button:hover,.top-actions button:hover{background:var(--panel3);color:#fff}.channel{width:100%;display:flex;gap:10px;align-items:center;background:transparent;color:var(--muted);padding:9px 11px;border-radius:8px;text-align:left;margin:2px 0;position:relative}.channel:hover,.channel.active{background:var(--panel3);color:#fff}.channel.active{box-shadow:inset 2px 0 var(--accent)}.channel-label{color:#70798c;font-size:10px;font-weight:900;letter-spacing:.14em;margin:17px 9px 7px}.badge{background:#f07191;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:9px;min-width:18px;text-align:center;margin-left:auto}.profile{margin-top:auto;background:var(--panel2);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer}.profile:hover{background:var(--panel3)}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;background:linear-gradient(145deg,#ff9c6a,#ce4f9b);font-weight:900;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover}.profile-info{min-width:0;flex:1}.profile-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:var(--muted);font-size:11px}.online:before{content:"";display:inline-block;width:7px;height:7px;background:var(--good);border-radius:50%;margin-right:5px}.profile-actions{display:flex;gap:1px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #ffffff0d;background:#10121b}.topbar h1{margin:0;font-size:16px}.topbar p{margin:2px 0;color:var(--muted);font-size:12px}.top-actions{margin-left:auto;display:flex;gap:4px;position:relative}.top-actions button{position:relative}.top-actions .notif-badge{position:absolute;top:0;right:0;background:#f07191;color:#fff;font-size:9px;font-weight:900;padding:1px 4px;border-radius:8px;min-width:14px;text-align:center;line-height:1.2}.view{display:none;flex:1;min-height:0;overflow:auto}.view.active{display:flex}.chat-view{flex-direction:column}.messages{flex:1;overflow:auto;padding:25px clamp(16px,4vw,55px);-webkit-overflow-scrolling:touch}.welcome{padding:20px 0;border-bottom:1px solid #ffffff0d;margin-bottom:10px}.welcome h2{margin:0 0 7px;font-size:28px}.welcome p{margin:0;color:var(--muted)}.message{display:flex;gap:12px;padding:7px;border-radius:9px;position:relative;animation:msgIn .22s cubic-bezier(.2,.8,.3,1) both}.message:hover{background:#ffffff08}.message .avatar{width:39px;height:39px}.message-head{display:flex;gap:9px;align-items:baseline}.time{font-size:11px;color:#6d7587}.message-text{margin-top:3px;white-space:pre-wrap;word-break:break-word;color:#f3f5fb}.message-sticker-wrap{position:relative;display:inline-block;margin-top:6px}.message-sticker{max-width:180px;max-height:180px;border-radius:12px;display:block}.message-media{max-width:290px;max-height:190px;border-radius:9px;margin-top:7px;display:block}@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}.message.removing{animation:msgOut .2s ease forwards;pointer-events:none}@keyframes msgOut{from{opacity:1;transform:scale(1);max-height:500px}to{opacity:0;transform:scale(.85);max-height:0;margin:0;padding:0;overflow:hidden}}

/* Звезда стикера */
.sticker-star{position:absolute;top:-12px;left:-12px;width:34px;height:34px;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.15);border-radius:50%;padding:0;cursor:pointer;opacity:0;transition:opacity .2s ease,transform .2s ease,background .2s ease,border-color .2s ease;z-index:5;display:grid;place-items:center;backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.message:hover .sticker-star,.message:active .sticker-star,.sticker-star.saved{opacity:1}
.sticker-star:hover{background:rgba(0,0,0,.8);transform:scale(1.08);border-color:rgba(255,255,255,.3)}
.sticker-star svg{width:20px;height:20px;display:block;transition:transform .2s ease,filter .2s ease}
.sticker-star svg path{fill:transparent;stroke:#fff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;transition:fill .2s ease,stroke .2s ease}
.sticker-star:hover svg path{fill:rgba(255,214,10,.35);stroke:#ffd60a}
.sticker-star.saved{background:rgba(255,214,10,.15);border-color:rgba(255,214,10,.5)}
.sticker-star.saved svg path{fill:#ffd60a;stroke:#ffb300}
.sticker-star.saved svg{filter:drop-shadow(0 0 6px rgba(255,214,10,.7))}
.sticker-star.pop svg{animation:starPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes starPop{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.5) rotate(15deg)}60%{transform:scale(.9) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.sticker-star::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:#0d0d0d;color:#fff;font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease;border:1px solid rgba(255,255,255,.1);z-index:10}
.sticker-star:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

.composer-wrap{padding:0 clamp(16px,4vw,55px) 18px}.composer{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid #ffffff0c;border-radius:12px;padding:8px;position:relative}.composer input{flex:1;background:transparent;border:0;outline:0;padding:10px;min-width:0}.compose{background:transparent;color:var(--muted);font-size:18px;padding:7px;flex:none}.compose:hover{color:#fff}.send,.primary{background:var(--accent);border-radius:9px;color:#fff;padding:9px 13px;font-weight:800}.send{height:38px;width:38px;padding:0;flex:none}.sticker-panel{position:absolute;bottom:60px;right:0;width:min(380px,calc(100vw - 40px));background:#1e1f22;border:1px solid #2b2d31;border-radius:14px;padding:12px;box-shadow:0 18px 50px #000c;z-index:30;max-height:340px;overflow:auto}.sticker-panel h4{margin:0 0 10px;font-size:13px;color:#fff;display:flex;justify-content:space-between;align-items:center}.sticker-panel h4 button{background:transparent;color:#9299aa;font-size:16px}.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sticker-item{position:relative;aspect-ratio:1;border-radius:10px;background:#2b2d31;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.15s}.sticker-item:hover{border-color:#8c6dff;transform:scale(1.04)}.sticker-item img{width:100%;height:100%;object-fit:cover}.sticker-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:12px;display:none;place-items:center;cursor:pointer;border:0;z-index:2}.sticker-item:hover .sticker-del{display:grid}.sticker-empty{text-align:center;color:#9299aa;font-size:13px;padding:20px}.right{background:#171a24;border-left:1px solid #ffffff0d;padding:20px 13px;overflow:auto}.right-title{display:flex;justify-content:space-between;color:#778094;font-size:10px;font-weight:900;letter-spacing:.14em;margin:0 8px 10px}.member{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer}.member:hover{background:var(--panel2)}.member .avatar{width:32px;height:32px}.offline{opacity:.45}.toast-stack{position:fixed;z-index:50;right:20px;bottom:20px;display:grid;gap:8px;max-width:calc(100vw - 40px)}.toast{background:#272d3bf4;border:1px solid #ffffff1a;border-radius:10px;padding:11px 13px;min-width:240px;box-shadow:0 16px 45px #0008;animation:toastIn .2s ease}@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.hidden{display:none!important}

/* ПКМ меню */
.ctx-menu{position:fixed;z-index:10000;background:#1e1f22;border:1px solid #2b2d31;border-radius:10px;padding:5px;box-shadow:0 12px 40px rgba(0,0,0,.75);min-width:190px;opacity:0;transform:scale(.92) translateY(-4px);transform-origin:top left;transition:opacity .13s ease,transform .13s ease;pointer-events:none}
.ctx-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.ctx-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:#dbdee1;font-size:13.5px;font-weight:500;cursor:pointer;background:transparent;border:0;width:100%;text-align:left;transition:background .12s ease,color .12s ease}
.ctx-item:hover{background:#35373c;color:#fff}
.ctx-item.danger{color:#f07191}
.ctx-item.danger:hover{background:#f0719122;color:#ff8ba7}
.ctx-icon{width:16px;text-align:center;font-size:14px;flex:none}
.ctx-sep{height:1px;background:#2b2d31;margin:4px 6px}

/* Voice */
.voice-view{justify-content:center;padding:30px}
.voice-room{max-width:600px;margin:0 auto;text-align:center;background:linear-gradient(145deg,#272544,#151d2b);border:1px solid #8c6dff55;border-radius:20px;padding:30px;box-shadow:0 25px 70px #05060b77;color:#f3f5fb;width:100%}
.voice-room h2{margin:0 0 6px;font-size:26px}
.vc-status{display:inline-block;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:18px}
.vc-status.connected{background:#4ed39b22;color:#4ed39b;border:1px solid #4ed39b55}
.vc-status.disconnected{background:#f0719122;color:#ffb5c6;border:1px solid #f0719155}
.vc-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.vc-join{background:#4ed39b;color:#0d0f15;font-weight:800;padding:14px 32px;font-size:15px;box-shadow:0 6px 24px #4ed39b55;border-radius:12px}
.vc-leave{background:#f07191;color:#fff;padding:12px 20px;border-radius:10px;font-weight:700}
.vc-controls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.vc-controls button{background:#ffffff13;border:1px solid #ffffff22;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:600}
.vc-controls button.on{background:#f07191;border-color:#f07191}
.vc-participants{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:60px}
.vc-part{background:#10131e99;border:1px solid #ffffff0d;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;min-width:220px;width:100%;max-width:340px}
.vc-part .avatar{width:42px;height:42px}

/* Friends view */
.friends-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid #2b2d31;padding-bottom:0}
.friend-tab{background:transparent;color:#9299aa;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;border:0;border-bottom:2px solid transparent;position:relative}
.friend-tab.active{color:#fff;border-bottom-color:#8c6dff}
.friend-tab .badge{display:inline-block;margin-left:6px}
.friend-row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel2);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.friend-row:hover{background:var(--panel3)}
.friend-row .avatar{width:44px;height:44px}
.friend-row .info{flex:1;min-width:0}
.friend-row .info strong{display:block;font-size:15px}
.friend-row .info small{color:var(--muted);font-size:12px}
.friend-row .actions{display:flex;gap:6px}
.friend-row .actions button{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.btn-accept{background:#4ed39b;color:#0d0f15}
.btn-reject{background:#f07191;color:#fff}
.btn-cancel{background:#4e5058;color:#fff}
.btn-msg{background:#5865f2;color:#fff}
.empty-state{text-align:center;padding:40px 20px;color:#9299aa}
.empty-state h3{color:#f3f5fb;margin:0 0 8px}
.add-friend-box{display:flex;gap:8px;margin-bottom:20px}
.add-friend-box input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;color:#fff;font-size:14px;outline:none}
.add-friend-box input:focus{border-color:#8c6dff}
.add-friend-box button{background:#5865f2;color:#fff;padding:11px 20px;border-radius:9px;font-weight:700;cursor:pointer;flex:none}

/* ЛС */
.dm-list{padding:0}
.dm-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;margin:2px 0;cursor:pointer;color:var(--muted)}
.dm-row:hover,.dm-row.active{background:var(--panel3);color:#fff}
.dm-row.active{box-shadow:inset 2px 0 var(--accent)}
.dm-row .avatar{width:32px;height:32px}
.dm-row .info{flex:1;min-width:0}
.dm-row .info strong{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-row .info small{font-size:11px;color:var(--muted)}

/* Auth */
.fb-auth{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#8c6dff44,transparent 40%),#0d0f15;padding:20px;overflow:auto;-webkit-overflow-scrolling:touch}
.fb-card{width:min(440px,100%);background:#171a24f2;border:1px solid #ffffff18;border-radius:20px;padding:30px;box-shadow:0 30px 100px #000b;color:#f3f5fb}
.fb-card h1{margin:0 0 6px;font-size:24px}.fb-card .sub{color:#9299aa;margin:0 0 22px;font-size:14px}
.fb-tabs{display:flex;gap:6px;margin-bottom:18px}.fb-tabs button{flex:1;border:0;border-radius:9px;padding:11px;background:#292e40;color:#9299aa;cursor:pointer;font-size:14px;font-weight:600}.fb-tabs button.active{background:#8c6dff;color:#fff}
.fb-field{margin-bottom:12px}.fb-field label{display:block;color:#9299aa;font-size:12px;margin-bottom:5px}.fb-field input{width:100%;background:#1e2230;border:1px solid #343b50;border-radius:9px;padding:12px;color:#fff;font-size:14px;outline:none}.fb-field input:focus{border-color:#8c6dff}
.fb-btn{width:100%;border:0;border-radius:9px;padding:12px;background:#8c6dff;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}.fb-msg{min-height:20px;font-size:13px;margin:10px 0;text-align:center}.fb-msg.err{color:#f07191}.fb-msg.ok{color:#4ed39b}.fb-forgot{display:block;text-align:center;color:#8c6dff;font-size:13px;margin-top:12px;cursor:pointer;background:none;border:0;width:100%}

/* Onboarding */
.onboard-avatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:20px auto;overflow:hidden;cursor:pointer;position:relative;border:5px solid #2b2d31;box-shadow:0 10px 40px #0008}
.onboard-avatar img{width:100%;height:100%;object-fit:cover}
.onboard-hint{color:#9299aa;font-size:12px;text-align:center;margin-bottom:20px}

/* Profile */
.dp-modal{position:fixed;inset:0;z-index:2000;background:#070912cc;backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;overflow:auto;-webkit-overflow-scrolling:touch}
.dp-card{width:min(420px,100%);border-radius:16px;overflow:hidden;box-shadow:0 30px 100px #000c;color:#fff;position:relative;background-size:cover;background-position:center}
.dp-close{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;background:#00000088;color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;border:0}
.dp-banner{height:110px;background:transparent}
.dp-avatar-wrap{margin-top:-60px;padding:0 18px;position:relative;z-index:2;display:flex}
.dp-avatar{width:100px;height:100px;border-radius:50%;border:6px solid transparent;overflow:hidden;display:grid;place-items:center;position:relative;box-shadow:0 6px 24px #000a}
.dp-avatar img{width:100%;height:100%;object-fit:cover}
.dp-status-dot{position:absolute;bottom:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#4ed39b;border:5px solid #232428;box-sizing:border-box}
.dp-info{padding:14px 18px 6px}
.dp-name{font-size:22px;font-weight:800;margin:0;color:#fff;text-shadow:0 2px 8px #0008}
.dp-handle{color:#ffffffcc;font-size:13px;margin:4px 0}
.dp-badges{display:flex;gap:6px;margin:8px 0}
.dp-badges span{background:#5865f2;color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;font-weight:700}
.dp-section{border-radius:10px;padding:12px 14px;margin:12px 18px;background:#00000055;backdrop-filter:blur(8px)}
.dp-section-title{color:#ffffffbb;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.05em;margin-bottom:6px}
.dp-bio{color:#ffffffdd;font-size:13px;line-height:1.4;white-space:pre-wrap}
.dp-actions{padding:8px 18px 18px;display:grid;gap:6px}
.dp-action{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;cursor:pointer;text-align:left;font-weight:500;background:#00000055;backdrop-filter:blur(8px)}
.dp-action .arrow{color:#ffffffbb;font-size:16px}
.dp-action .left{display:flex;align-items:center;gap:10px}
.dp-dot{width:12px;height:12px;border-radius:50%;background:#4ed39b}

/* Edit */
.dp-edit-header{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid #1e1f22;background:#232428}
.dp-edit-header h2{margin:0;font-size:18px;color:#fff}
.dp-edit-header button{background:#4e5058;color:#fff;border:0;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.dp-edit-body{padding:16px 18px 18px;display:grid;gap:16px;max-height:75vh;overflow:auto;background:#232428;color:#f3f5fb;-webkit-overflow-scrolling:touch}
.dp-edit-body label{font-size:11px;text-transform:uppercase;color:#b9bbbe;font-weight:800;letter-spacing:.05em;display:block;margin-bottom:6px}
.dp-edit-body input[type=text],.dp-edit-body textarea{width:100%;background:#1e1f22;border:1px solid #111214;border-radius:8px;padding:10px;color:#f3f5fb;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit}
.dp-avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.dp-av-choice{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;display:grid;place-items:center;overflow:hidden}
.dp-av-choice.selected{border-color:#5865f2;box-shadow:0 0 0 2px #5865f2}
.dp-av-choice img{width:100%;height:100%;object-fit:cover}
.dp-tabs-banner{display:flex;gap:6px;margin-bottom:10px}
.dp-tabs-banner button{background:#2b2d31;border:0;color:#b9bbbe;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.dp-tabs-banner button.active{background:#5865f2;color:#fff}
.dp-banner-preview{height:100px;border-radius:10px;background:#49358c;background-size:cover;background-position:center;margin-bottom:12px;border:1px solid #111214}
.dp-grad-controls{display:grid;gap:10px}
.dp-grad-row{display:flex;align-items:center;gap:10px}
.dp-grad-row>label{flex:0 0 110px;font-size:12px;color:#b9bbbe;font-weight:600;margin:0}
.dp-grad-row input[type=color]{width:48px;height:36px;border:1px solid #111214;background:#1e1f22;border-radius:7px;cursor:pointer;padding:2px}
.dp-grad-row input[type=range]{flex:1;accent-color:#5865f2}
.dp-save{width:100%;background:#5865f2;color:#fff;border:0;padding:13px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.dp-upload-btn{background:#4e5058;color:#fff;border:0;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}

/* Settings */
.st-layout{background:#232428;width:min(760px,100%);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:210px 1fr;min-height:520px;color:#f3f5fb;box-shadow:0 30px 100px #000c}
.st-side{background:#1e1f22;padding:20px 10px;display:flex;flex-direction:column;gap:3px}
.st-side h3{margin:0 10px 14px;font-size:14px;color:#fff}
.stnav{background:transparent;border:0;color:#b9bbbe;text-align:left;padding:10px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.stnav:hover{background:#2b2d31;color:#fff}.stnav.active{background:#404249;color:#fff}.stnav.danger{color:#f07191}
.st-main{padding:24px 26px;overflow:auto;max-height:80vh;-webkit-overflow-scrolling:touch}
.st-main h2{margin:0 0 16px;font-size:18px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #2b2d31;gap:14px}
.st-row label{font-weight:700;color:#fff;font-size:14px}
.st-row input[type=text],.st-row select{background:#1e1f22;border:1px solid #111214;border-radius:7px;padding:9px 11px;color:#fff;min-width:220px;outline:none;font-size:13px}
.st-switch{width:44px;height:24px;border-radius:99px;background:#3e4455;padding:3px;cursor:pointer;border:0;flex:none}
.st-switch.on{background:#5865f2}
.st-switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.st-switch.on:after{transform:translateX(20px)}
.st-primary{background:#5865f2;color:#fff;border:0;padding:11px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
.save-all{width:100%;background:#4ed39b!important;color:#0d0f15!important;font-weight:800!important;padding:14px!important;margin-top:16px!important;font-size:15px!important}

/* Мобильная адаптация */
@media(max-width:1100px){.app{grid-template-columns:68px 220px minmax(300px,1fr)}.right{display:none}}
@media(max-width:700px){
.app{display:block;height:100vh;height:100dvh}
.rail{position:fixed;bottom:0;left:0;right:0;height:60px;flex-direction:row;justify-content:space-around;padding:6px 4px;z-index:15;border-top:1px solid #ffffff0d;border-right:none;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.rail hr,.rail-spacer,.brand{display:none}
.rail .server{width:44px;height:44px;border-radius:14px;font-size:14px}
.channels{display:none;position:fixed;top:0;left:0;right:0;bottom:60px;z-index:14;border-right:none;padding:14px 10px;overflow:auto;-webkit-overflow-scrolling:touch}
.channels.open{display:flex}
.main{height:calc(100vh - 60px);height:calc(100dvh - 60px);display:flex}
.topbar{padding:0 12px;height:60px;gap:8px}
.topbar h1{font-size:15px}
.messages{padding:14px 12px}
.message{padding:6px;gap:8px}
.message .avatar{width:34px;height:34px}
.composer-wrap{padding:0 10px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.composer{padding:6px;gap:4px}
.st-layout{grid-template-columns:1fr;border-radius:0;width:100%;min-height:100vh;min-height:100dvh}
.st-side{flex-direction:row;overflow-x:auto;padding:10px;gap:6px}
.st-side h3{display:none}
.stnav{white-space:nowrap;flex:none;padding:9px 14px;font-size:12px;background:#2b2d31}
.st-main{padding:16px 14px}
.st-row{flex-direction:column;align-items:flex-start;gap:8px}
.st-row input[type=text],.st-row select{width:100%;min-width:0}
.dp-modal{padding:0}
.dp-card{width:100%;height:100vh;height:100dvh;border-radius:0;overflow-y:auto}
.fb-card{padding:22px 18px;border-radius:16px}
.sticker-panel{position:fixed;left:8px;right:8px;bottom:76px;width:auto;max-height:50vh}
.toast-stack{right:10px;bottom:76px;left:10px;bottom:calc(76px + env(safe-area-inset-bottom))}
.toast{min-width:0}
}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><button class="brand" title="L-Chat">L</button><hr><button class="server active" data-view="chat" title="Главная">⌂</button><button class="server" data-view="friends" title="Друзья" id="railFriends">♧<span class="badge hidden" id="railFriendsBadge">0</span></button><button class="server" data-view="voice" title="Голос">◉</button><button class="server" title="Студия">✦</button><button class="server" title="Игры">G</button><button class="server" title="Музыка">♫</button><button class="server" title="Добавить">＋</button><div class="rail-spacer"></div><button class="server" id="railSettings" title="Настройки">⚙</button></aside>
<aside class="channels" id="channels"><div class="workspace">L-CHAT <button>⌄</button></div><button class="channel active" data-view="chat">⌂ <span>Главная</span></button><button class="channel" data-view="friends">♧ <span>Друзья <b id="friendCount">0</b></span> <span class="badge hidden" id="friendTabBadge">0</span></button><button class="channel" data-view="voice">◉ <span>Голос</span></button><div class="channel-label">ТЕКСТОВЫЕ КАНАЛЫ</div><button class="channel text active" data-channel="general"># <span>общий</span></button><button class="channel text" data-channel="gaming"># <span>игры</span></button><button class="channel text" data-channel="memes"># <span>мемы</span></button><button class="channel text" data-channel="off-topic"># <span>флудилка</span></button><div class="channel-label">ЛИЧНЫЕ СООБЩЕНИЯ</div><div id="dmList" class="dm-list"></div><div class="channel-label">ГОЛОСОВЫЕ КАНАЛЫ</div><button class="channel voice" data-voice="general">🔊 <span>Общий</span></button><button class="channel voice" data-voice="gaming">🔊 <span>Игры</span></button><button class="channel voice" data-voice="chill">🔊 <span>Отдых</span></button><div class="profile" id="bottomProfile"><button class="avatar" id="miniAvatar"></button><div class="profile-info"><strong id="miniName">Новый аккаунт</strong><span class="status online" id="miniStatus">В сети</span></div><div class="profile-actions"><button id="micButton">🎤</button><button id="deafenButton">🎧</button><button id="profileSettings">⚙</button></div></div></aside>
<main class="main"><header class="topbar"><div><h1 id="topTitle"># общий</h1><p id="topTopic">Тема: Общее</p></div><div class="top-actions"><button id="mobileChannels">☰</button><button id="notifButton" title="Уведомления">🔔<span class="notif-badge hidden" id="notifBadge">0</span></button><button>👥</button></div></header>
<section class="view chat-view active" id="chatView"><div class="messages" id="messages"></div><div class="composer-wrap"><div class="composer"><button class="compose" id="fileButton">📎</button><input id="messageInput" placeholder="Сообщение..."><button class="compose" id="stickerButton">😀</button><button class="compose" id="myStickerBtn" title="Избранные стикеры">⭐</button><button class="send" id="sendButton">➤</button><input id="chatFile" type="file" accept="image/*" hidden><input id="stickerFile" type="file" accept="image/*,.gif" hidden></div></div></section>
<section class="view" id="friendsView"><div style="padding:24px;max-width:700px;width:100%;margin:0 auto">
<h2 style="margin:0 0 16px">Друзья</h2>
<div class="add-friend-box"><input id="addFriendInput" placeholder="Введите ник друга..."><button id="addFriendBtn">Отправить заявку</button></div>
<div class="friends-tabs"><button class="friend-tab active" data-ftab="all">Все друзья <span class="badge hidden" id="ftAllBadge">0</span></button><button class="friend-tab" data-ftab="incoming">Входящие <span class="badge hidden" id="ftIncBadge">0</span></button><button class="friend-tab" data-ftab="outgoing">Исходящие</button></div>
<div id="friendsContent"></div>
</div></section>
<section class="view voice-view" id="voiceView"><div class="voice-room"><h2 id="voiceTitle">🔊 Общий</h2><div><span class="vc-status disconnected" id="vcStatus">Не подключён</span></div><div class="vc-participants" id="voiceParticipants"></div><div class="vc-controls" id="vcControls" style="display:none"><button id="voiceMuteBtn">🎤 Микрофон</button><button id="voiceDeafenBtn">🎧 Звук</button></div><div class="vc-buttons"><button class="vc-join" id="voiceJoin">🔗 Подключиться</button><button class="vc-leave" id="voiceDisconnect" style="display:none">📞 Отключиться</button></div></div></section>
</main>
<aside class="right" id="userList"><div class="right-title">В СЕТИ <span id="onlineCount">0</span></div><div id="onlineMembers"></div><div class="right-title" style="margin-top:22px">НЕ В СЕТИ <span id="offlineCount">0</span></div><div id="offlineMembers"></div></aside>
</div>
<div class="toast-stack" id="toasts"></div>
<div id="modalRoot"></div>
<script>
const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5865f2"/><stop offset="100%" stop-color="#8c6dff"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`);
function colorAvatar(c){return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`)}
const AVATAR_PRESETS=[{label:'Стандарт',src:DEFAULT_AVATAR},{label:'Красная',src:colorAvatar('#ed4245')},{label:'Оранж',src:colorAvatar('#faa61a')},{label:'Жёлтая',src:colorAvatar('#f0b232')},{label:'Зелёная',src:colorAvatar('#23a55a')},{label:'Бирюза',src:colorAvatar('#1abc9c')},{label:'Циан',src:colorAvatar('#00b0f4')},{label:'Синяя',src:colorAvatar('#5865f2')},{label:'Фиолет',src:colorAvatar('#8c6dff')},{label:'Розовая',src:colorAvatar('#eb459e')},{label:'Тёмная',src:colorAvatar('#2b2d31')},{label:'Серая',src:colorAvatar('#80848e')}];
const defaults={channel:'general',view:'chat',mic:true,deaf:false,voiceConnected:false,username:'Новый аккаунт',about:'',avatar:DEFAULT_AVATAR,banner:'',bannerGradient:{c1:'#8c6dff',c2:'#2b1a63',angle:180},status:'online',accent:'#8c6dff',animations:true,compact:false,myStickers:[],messages:{general:[],gaming:[],memes:[],'off-topic':[]},friends:[],activeDm:null,dmList:[]};
function loadState(){let s={};try{s=JSON.parse(localStorage.getItem('l-chat-v2')||'{}')||{}}catch(e){}const m={...defaults,...s};m.messages={...defaults.messages,...(s.messages||{})};m.friends=Array.isArray(s.friends)?[...s.friends]:[];m.avatar=s.avatar||DEFAULT_AVATAR;m.username=s.username||'Новый аккаунт';m.bannerGradient={...defaults.bannerGradient,...(s.bannerGradient||{})};m.myStickers=Array.isArray(s.myStickers)?[...s.myStickers]:[];m.dmList=Array.isArray(s.dmList)?[...s.dmList]:[];return m}
let state=loadState();
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('l-chat-v2',JSON.stringify(state))}catch(e){}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,d=''){const n=document.createElement('div');n.className='toast';n.innerHTML='<b>'+esc(t)+'</b>'+(d?'<small style="color:#9299aa;display:block">'+esc(d)+'</small>':'');$('toasts').append(n);setTimeout(()=>n.remove(),3000)}

// Глобальное хранилище
window.__onlineUsers = {};   // { username: { uid, avatar, status } }
window.__allUsers = {};      // { username_lower: { uid, username, avatar } }
window.__incoming = [];      // входящие заявки [{fromUid, fromName, fromAvatar}]
window.__outgoing = [];      // исходящие [{toUid, toName}]
window.__dmMessages = {};    // { dmId: [...] }
window.__currentFriendsTab = 'all';

// ==== Звуки ====
let audioCtxSound=null;
function playSound(type){try{if(!audioCtxSound)audioCtxSound=new (window.AudioContext||window.webkitAudioContext)();if(audioCtxSound.state==='suspended')audioCtxSound.resume();const ctx=audioCtxSound,now=ctx.currentTime;function note(f,s,d,v=0.06){const g=ctx.createGain();g.connect(ctx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.008);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,now+s);o.connect(g);o.start(now+s);o.stop(now+s+d)}function slide(f1,f2,s,d,v=0.05){const g=ctx.createGain();g.connect(ctx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.008);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f1,now+s);o.frequency.exponentialRampToValueAtTime(f2,now+s+d);o.connect(g);o.start(now+s);o.stop(now+s+d)}if(type==='join'){note(659.25,0,0.18,0.07);note(987.77,0.10,0.22,0.06)}else if(type==='leave'){note(783.99,0,0.16,0.06);note(523.25,0.09,0.20,0.06)}else if(type==='mute'){slide(600,320,0,0.10,0.07)}else if(type==='unmute'){slide(500,900,0,0.10,0.07)}else if(type==='deafen'){slide(380,200,0,0.14,0.06);note(150,0.06,0.14,0.04)}else if(type==='undeafen'){slide(220,400,0,0.10,0.05);note(700,0.10,0.12,0.05)}else if(type==='star'){note(880,0,0.09,0.05);note(1174.66,0.06,0.14,0.05)}else if(type==='notify'){note(880,0,0.1,0.05);note(1100,0.08,0.15,0.05)}}catch(e){}}

function getCardGradient(){const g=state.bannerGradient;if(state.banner)return '';return `background:linear-gradient(${g.angle}deg, ${g.c1} 0%, ${g.c1} 25%, ${g.c2} 100%);`}
function getBannerStyle(){const g=state.bannerGradient;if(state.banner)return `background-image:url('${state.banner}');background-size:cover;background-position:center`;return `background:linear-gradient(${g.angle}deg,${g.c1},${g.c2})`}
function av(name,extra=''){
  if(name===state.username)return '<div class="avatar '+extra+'"><img src="'+state.avatar+'"></div>';
  const ou = window.__onlineUsers[name];
  if(ou && ou.avatar)return '<div class="avatar '+extra+'"><img src="'+ou.avatar+'"></div>';
  const au = window.__allUsers[name.toLowerCase()];
  if(au && au.avatar)return '<div class="avatar '+extra+'"><img src="'+au.avatar+'"></div>';
  return '<div class="avatar '+extra+'">'+(name||'?').slice(0,2).toUpperCase()+'</div>';
}

function setView(v){
  state.view=v;save();
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v+'View'));
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  if(v==='chat')renderChat();
  if(v==='friends')renderFriendsView();
  if(v==='voice')renderVoice();
}

const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.1 6.6L12 17.7l-5.8 3.1 1.1-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';

// ====== ЧАТ ======
function renderChat(){
  const c=state.channel;
  let title, topic;
  if(c.startsWith('dm:')){
    const other = c.slice(3);
    title = '💬 '+other;
    topic = 'Личные сообщения';
    renderDmMessages(other);
    return;
  }
  const names={general:'общий',gaming:'игры',memes:'мемы','off-topic':'флудилка'};
  title = '# '+(names[c]||c);
  topic = 'Тема: Общее';
  $('topTitle').textContent=title;
  $('topTopic').textContent=topic;
  const list=state.messages[c]||[];
  const msgs=list.map((m,i)=>renderMessage(m,i)).join('');
  $('messages').innerHTML='<div class="welcome"><h2>Добро пожаловать в #'+(names[c]||c)+'</h2><p>Начало беседы</p></div>'+(list.length?msgs:'<p class="status" style="padding:20px 0">Сообщений пока нет.</p>');
  bindStarHandlers(list);
  attachContextMenu(c, list);
  $('messages').scrollTop=$('messages').scrollHeight;
}

function renderDmMessages(other){
  const dmId = dmId_(state.username, other);
  const list = window.__dmMessages[dmId] || [];
  $('topTitle').textContent='💬 '+other;
  $('topTopic').textContent='Личные сообщения';
  const msgs = list.map((m,i)=>renderMessage(m,i)).join('');
  $('messages').innerHTML=(list.length?msgs:'<p class="status" style="padding:20px 0">Начни общение с '+esc(other)+'!</p>');
  bindStarHandlers(list);
  attachContextMenu('dm:'+other, list);
  $('messages').scrollTop=$('messages').scrollHeight;
}

function renderMessage(m,i){
  const isSticker=m[1]==='[Sticker]';
  let content='';
  if(isSticker){
    const saved=state.myStickers.includes(m[3]);
    const tooltip=saved?'Убрать из избранного':'Добавить в избранное';
    content='<div class="message-sticker-wrap"><img class="message-sticker" src="'+m[3]+'" alt="стикер"><button class="sticker-star '+(saved?'saved':'')+'" data-star="'+i+'" data-tooltip="'+tooltip+'">'+STAR_SVG+'</button></div>';
  } else {
    content='<div class="message-text">'+esc(m[1])+'</div>';
    if(m[3])content+='<img class="message-media" src="'+m[3]+'" alt="">';
  }
  return '<article class="message" data-msg-id="'+i+'">'+av(m[0])+'<div><div class="message-head"><strong>'+esc(m[0])+'</strong><span class="time">'+esc(m[2])+'</span></div>'+content+'</div></article>';
}

function bindStarHandlers(list){
  document.querySelectorAll('[data-star]').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const idx=+b.dataset.star;
      const stickerSrc=list[idx][3];
      if(!stickerSrc)return;
      const pos=state.myStickers.indexOf(stickerSrc);
      if(pos>=0){
        state.myStickers.splice(pos,1);
        b.classList.remove('saved');b.dataset.tooltip='Добавить в избранное';
        b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),450);
        toast('Убрано из избранного');
      } else {
        state.myStickers.push(stickerSrc);
        b.classList.add('saved','pop');b.dataset.tooltip='Убрать из избранного';
        setTimeout(()=>b.classList.remove('pop'),450);
        playSound('star');toast('⭐ Добавлено в избранное');
      }
      save();if(window.__saveProfileCloud)window.__saveProfileCloud();
    };
  });
}

function attachContextMenu(channel, list){
  document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
  document.querySelectorAll('.message[data-msg-id]').forEach(art=>{
    art.oncontextmenu = e => {
      const idx = +art.dataset.msgId;
      const msg = list[idx];if(!msg)return;
      const isMine = msg[0] === state.username;
      const isSticker = msg[1]==='[Sticker]';
      const stickerSrc = msg[3];
      const isSaved = isSticker && stickerSrc && state.myStickers.includes(stickerSrc);
      e.preventDefault();
      document.querySelectorAll('.ctx-menu').forEach(m=>m.remove());
      const menu = document.createElement('div');menu.className='ctx-menu';
      let html = '';
      if (msg[1] && msg[1]!=='[Sticker]' && msg[1]!=='[File]') html += '<button class="ctx-item" data-act="copy"><span class="ctx-icon">📋</span>Копировать текст</button>';
      if (msg[3] && !isSticker) html += '<button class="ctx-item" data-act="copyimg"><span class="ctx-icon">🖼</span>Копировать картинку</button>';
      if (isSticker && stickerSrc) html += '<button class="ctx-item" data-act="star"><span class="ctx-icon">'+(isSaved?'💛':'⭐')+'</span>'+(isSaved?'Убрать из избранного':'Добавить в избранное')+'</button>';
      if (isMine){ if(html)html+='<div class="ctx-sep"></div>'; html += '<button class="ctx-item danger" data-act="delete"><span class="ctx-icon">🗑</span>Удалить</button>'; }
      if (!html) return;
      menu.innerHTML = html;document.body.appendChild(menu);
      const mw=menu.offsetWidth, mh=menu.offsetHeight;
      let x=e.clientX,y=e.clientY;
      if(x+mw>window.innerWidth-8)x=window.innerWidth-mw-8;
      if(y+mh>window.innerHeight-8)y=window.innerHeight-mh-8;
      menu.style.left=x+'px';menu.style.top=y+'px';
      requestAnimationFrame(()=>menu.classList.add('show'));
      menu.querySelectorAll('.ctx-item').forEach(btn=>{
        btn.onclick = () => {
          const act = btn.dataset.act;
          menu.classList.remove('show');setTimeout(()=>menu.remove(),130);
          if (act==='copy') navigator.clipboard.writeText(msg[1]).then(()=>toast('📋 Скопировано')).catch(()=>toast('Ошибка'));
          else if (act==='copyimg') fetch(msg[3]).then(r=>r.blob()).then(blob=>{if(navigator.clipboard&&window.ClipboardItem)navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]).then(()=>toast('🖼 Скопировано'))}).catch(()=>toast('Ошибка'));
          else if (act==='star'){ if(isSaved){const p=state.myStickers.indexOf(stickerSrc);if(p>=0)state.myStickers.splice(p,1);toast('Убрано')}else{state.myStickers.push(stickerSrc);playSound('star');toast('⭐ Добавлено')} save();renderChat();if(window.__saveProfileCloud)window.__saveProfileCloud(); }
          else if (act==='delete'){
            const box=$('messages');const prevScroll=box.scrollTop;
            art.classList.add('removing');
            setTimeout(()=>{
              if (channel.startsWith('dm:')) {
                const other = channel.slice(3);
                const dmId = dmId_(state.username, other);
                if (window.__dmMessages[dmId]) window.__dmMessages[dmId].splice(idx,1);
                if (window.__deleteDmCloud) window.__deleteDmCloud(dmId, idx);
              } else {
                state.messages[channel].splice(idx,1);
                if (window.__deleteChannelMessageCloud) window.__deleteChannelMessageCloud(channel, idx);
              }
              save();renderChat();
              box.scrollTop=prevScroll;
            },200);
          }
        };
      });
      setTimeout(()=>{
        const close = ev => { if(!menu.contains(ev.target)){menu.classList.remove('show');setTimeout(()=>menu.remove(),130);document.removeEventListener('mousedown',close);document.removeEventListener('scroll',close,true);} };
        document.addEventListener('mousedown', close);
        document.addEventListener('scroll', close, true);
      }, 10);
    };
  });
}

function send(){
  const i=$('messageInput');const v=i.value.trim();if(!v)return;
  const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if (state.channel.startsWith('dm:')) {
    const other = state.channel.slice(3);
    const dmId = dmId_(state.username, other);
    window.__dmMessages[dmId] = window.__dmMessages[dmId]||[];
    window.__dmMessages[dmId].push([state.username, v, t]);
    if (window.__sendDmCloud) window.__sendDmCloud(dmId, [state.username, v, t]);
    renderChat();
  } else {
    state.messages[state.channel]=state.messages[state.channel]||[];
    state.messages[state.channel].push([state.username,v,t]);
    save();renderChat();
    if (window.__sendChannelMessageCloud) window.__sendChannelMessageCloud(state.channel,[state.username,v,t]);
  }
  i.value='';
}

function dmId_(a,b){ return 'dm_' + [a.toLowerCase(), b.toLowerCase()].sort().join('_'); }

function renderMembers(){
  const onlineUsers = window.__onlineUsers || {};
  const onlineNames = Object.keys(onlineUsers);
  if (!onlineNames.includes(state.username)) onlineNames.push(state.username);
  const unique = [...new Set(onlineNames)];
  $('onlineCount').textContent = unique.length;
  $('onlineMembers').innerHTML = unique.map(n=>{
    const u = onlineUsers[n] || {};
    return '<div class="member">'+av(n,'',u.avatar)+'<div><strong>'+esc(n)+'</strong><small>В сети</small></div></div>';
  }).join('');
  $('offlineMembers').innerHTML='';
  $('offlineCount').textContent='0';
}

// ====== ДРУЗЬЯ ======
function renderFriendsView(){
  updateBadges();
  const tab = window.__currentFriendsTab || 'all';
  document.querySelectorAll('.friend-tab').forEach(t=>t.classList.toggle('active',t.dataset.ftab===tab));
  const c = $('friendsContent');

  if (tab === 'all') {
    const friends = state.friends || [];
    if (!friends.length) {
      c.innerHTML = '<div class="empty-state"><h3>Нет друзей</h3><p>Введи ник сверху, чтобы отправить заявку.</p></div>';
    } else {
      c.innerHTML = friends.map(f=>{
        const online = !!window.__onlineUsers[f];
        const au = window.__allUsers[f.toLowerCase()] || {};
        return '<div class="friend-row" data-dm="'+esc(f)+'">'+
          av(f,'',au.avatar)+
          '<div class="info"><strong>'+esc(f)+'</strong><small>'+(online?'🟢 В сети':'⚪ Не в сети')+'</small></div>'+
          '<div class="actions"><button class="btn-msg">💬 Написать</button></div>'+
        '</div>';
      }).join('');
      c.querySelectorAll('[data-dm]').forEach(row=>row.onclick=()=>openDm(row.dataset.dm));
    }
  } else if (tab === 'incoming') {
    const inc = window.__incoming || [];
    if (!inc.length) c.innerHTML = '<div class="empty-state"><h3>Нет входящих заявок</h3><p>Пока никто не хочет добавить тебя.</p></div>';
    else c.innerHTML = inc.map(r=>'<div class="friend-row">'+av(r.fromName,'',r.fromAvatar)+'<div class="info"><strong>'+esc(r.fromName)+'</strong><small>Хочет добавить тебя</small></div><div class="actions"><button class="btn-accept" data-accept="'+esc(r.fromUid)+'" data-name="'+esc(r.fromName)+'">✓ Принять</button><button class="btn-reject" data-reject="'+esc(r.fromUid)+'">✕</button></div></div>').join('');
    c.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>acceptFriend(b.dataset.accept, b.dataset.name));
    c.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectFriend(b.dataset.reject));
  } else {
    const out = window.__outgoing || [];
    if (!out.length) c.innerHTML = '<div class="empty-state"><h3>Нет исходящих</h3><p>Ты пока никому не отправил заявку.</p></div>';
    else c.innerHTML = out.map(r=>'<div class="friend-row"><div class="info"><strong>'+esc(r.toName)+'</strong><small>Ожидает ответа</small></div><div class="actions"><button class="btn-cancel" data-cancel="'+esc(r.toUid)+'">Отменить</button></div></div>').join('');
    c.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelRequest(b.dataset.cancel));
  }
}

function updateBadges(){
  const inc = (window.__incoming||[]).length;
  const out = (window.__outgoing||[]).length;
  const fCount = (state.friends||[]).length;
  $('friendCount').textContent = fCount;
  ['railFriendsBadge','friendTabBadge','notifBadge'].forEach(id=>{
    const el=$(id); if(!el)return;
    if (inc>0) { el.textContent = inc>9?'9+':inc; el.classList.remove('hidden'); }
    else { el.classList.add('hidden'); }
  });
  ['ftIncBadge'].forEach(id=>{
    const el=$(id); if(!el)return;
    if (inc>0){el.textContent=inc;el.classList.remove('hidden')}else el.classList.add('hidden');
  });
  ['ftAllBadge'].forEach(id=>{
    const el=$(id); if(!el)return;
    if (fCount>0){el.textContent=fCount;el.classList.remove('hidden')}else el.classList.add('hidden');
  });
}

async function sendFriendRequest(){
  const inp = $('addFriendInput');
  const nick = inp.value.trim();
  if (!nick) return toast('Введи ник');
  if (nick.toLowerCase() === state.username.toLowerCase()) return toast('Это ты');
  if ((state.friends||[]).some(f=>f.toLowerCase()===nick.toLowerCase())) return toast('Уже в друзьях');

  if (window.__sendFriendRequestCloud) {
    const r = await window.__sendFriendRequestCloud(nick);
    if (r && r.ok) { inp.value=''; toast('✅ Заявка отправлена','Ожидай подтверждения'); }
    else toast('❌ '+(r?.error||'Не удалось'));
  }
}

async function acceptFriend(fromUid, fromName){
  if (window.__acceptFriendCloud) {
    const r = await window.__acceptFriendCloud(fromUid, fromName);
    if (r && r.ok) toast('✅ Теперь вы друзья','Общайтесь!');
  }
}
async function rejectFriend(fromUid){
  if (window.__rejectFriendCloud) await window.__rejectFriendCloud(fromUid);
  toast('Заявка отклонена');
}
async function cancelRequest(toUid){
  if (window.__cancelRequestCloud) await window.__cancelRequestCloud(toUid);
  toast('Отменено');
}

function renderDmList(){
  const list = state.dmList || [];
  const container = $('dmList');
  if (!container) return;
  if (!list.length){
    container.innerHTML = '<div style="padding:8px 11px;color:#70798c;font-size:12px">Друзья появятся тут после принятия</div>';
    return;
  }
  container.innerHTML = list.map(name=>{
    const active = state.channel === 'dm:'+name;
    const online = !!window.__onlineUsers[name];
    const au = window.__allUsers[name.toLowerCase()] || {};
    return '<button class="dm-row '+(active?'active':'')+'" data-dmopen="'+esc(name)+'">'+
      av(name,'',au.avatar)+
      '<div class="info"><strong>'+esc(name)+'</strong><small>'+(online?'🟢 В сети':'⚪ Не в сети')+'</small></div>'+
    '</button>';
  }).join('');
  container.querySelectorAll('[data-dmopen]').forEach(b=>b.onclick=()=>openDm(b.dataset.dmopen));
}

function openDm(name){
  state.channel = 'dm:'+name;
  save();
  setView('chat');
  renderDmList();
  $('channels').classList.remove('open');
}

function openMyStickers(){
  const existing=document.querySelector('.sticker-panel');
  if(existing){existing.remove();return;}
  const panel=document.createElement('div');panel.className='sticker-panel';
  const items=state.myStickers.length?state.myStickers.map((s,i)=>`<div class="sticker-item" data-idx="${i}"><img src="${s}"><button class="sticker-del" data-del="${i}">×</button></div>`).join(''):'<div class="sticker-empty" style="grid-column:1/-1">Пока нет избранных стикеров.<br><br>Наведи на стикер в чате и нажми ⭐</div>';
  panel.innerHTML=`<h4>⭐ Избранные (${state.myStickers.length}) <button id="closeStickers">✕</button></h4><div class="sticker-grid">${items}</div>`;
  document.querySelector('.composer').appendChild(panel);
  document.getElementById('closeStickers').onclick=()=>panel.remove();
  panel.querySelectorAll('[data-idx]').forEach(el=>el.onclick=e=>{
    if(e.target.dataset.del!==undefined)return;
    const src=state.myStickers[+el.dataset.idx];
    const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if (state.channel.startsWith('dm:')){
      const other=state.channel.slice(3);
      const id=dmId_(state.username,other);
      window.__dmMessages[id]=window.__dmMessages[id]||[];
      window.__dmMessages[id].push([state.username,'[Sticker]',t,src]);
      if(window.__sendDmCloud)window.__sendDmCloud(id,[state.username,'[Sticker]',t,src]);
      renderChat();
    } else {
      state.messages[state.channel]=state.messages[state.channel]||[];
      state.messages[state.channel].push([state.username,'[Sticker]',t,src]);
      save();renderChat();
      if(window.__sendChannelMessageCloud)window.__sendChannelMessageCloud(state.channel,[state.username,'[Sticker]',t,src]);
    }
    panel.remove();toast('✅ Стикер отправлен');
  });
  panel.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();state.myStickers.splice(+b.dataset.del,1);save();panel.remove();openMyStickers();toast('Удалено');
    if(window.__saveProfileCloud)window.__saveProfileCloud();
  });
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, onSnapshot, addDoc, query, orderBy, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAd9pHc6isaZJDpdpbDeDhwygBu48YkxWc",authDomain:"latyykkchat.firebaseapp.com",projectId:"latyykkchat",storageBucket:"latyykkchat.firebasestorage.app",messagingSenderId:"64363134386",appId:"1:64363134386:web:7ba8223c4e1f89dad4b8ab"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid=null;
let unsubOnline=null, unsubUsers=null, unsubIncoming=null, unsubOutgoing=null, pingInterval=null;
let dmUnsubs={};

// ==== Онлайн ====
window.__pushOnline = async function(){
  if (!currentUid) return;
  try {
    await setDoc(doc(db,'online',currentUid), {
      name: state.username,
      avatar: state.avatar,
      status: state.status,
      lastSeen: Date.now()
    }, {merge:true});
  } catch(e){ console.warn('pushOnline', e); }
};

function startOnline(uid){
  currentUid = uid;
  window.__pushOnline();
  if (pingInterval) clearInterval(pingInterval);
  pingInterval = setInterval(()=>window.__pushOnline(), 20000);
  if (unsubOnline) unsubOnline();
  unsubOnline = onSnapshot(collection(db,'online'), snap=>{
    const now = Date.now();
    const users = {};
    snap.forEach(d=>{
      const data = d.data();
      if (data.lastSeen && (now - data.lastSeen) < 90000) {
        users[data.name] = { avatar: data.avatar, status: data.status, lastSeen: data.lastSeen };
      }
    });
    window.__onlineUsers = users;
    if (typeof renderMembers === 'function') renderMembers();
    if (typeof renderDmList === 'function') renderDmList();
    if (typeof renderFriendsView === 'function' && state.view === 'friends') renderFriendsView();
  });
}

window.addEventListener('beforeunload', ()=>{ if (currentUid) { try{deleteDoc(doc(db,'online',currentUid))}catch(e){} } });

// ==== Все юзеры ====
function startUsersSubscription(){
  if (unsubUsers) unsubUsers();
  unsubUsers = onSnapshot(collection(db,'users'), snap=>{
    const all = {};
    snap.forEach(d=>{
      const u = d.data();
      if (u.username) all[u.username.toLowerCase()] = { uid: d.id, username: u.username, avatar: u.avatar };
    });
    window.__allUsers = all;
    if (typeof renderFriendsView === 'function' && state.view === 'friends') renderFriendsView();
    if (typeof renderDmList === 'function') renderDmList();
  });
}

// ==== Профиль ====
window.__saveProfileCloud = async function(){
  if (!currentUid) return;
  try {
    await setDoc(doc(db,'users',currentUid), {
      username: state.username,
      usernameLower: state.username.toLowerCase(),
      about: state.about||'',
      avatar: state.avatar,
      banner: state.banner||'',
      bannerGradient: state.bannerGradient,
      status: state.status,
      friends: state.friends,
      dmList: state.dmList,
      myStickers: state.myStickers,
      updatedAt: Date.now()
    }, {merge:true});
  } catch(e){ console.warn('saveProfile', e); }
};

async function loadProfileCloud(uid){
  try {
    const snap = await getDoc(doc(db,'users',uid));
    if (snap.exists()) {
      const d = snap.data();
      if (d.username) state.username = d.username;
      if (typeof d.about === 'string') state.about = d.about;
      if (d.avatar) state.avatar = d.avatar;
      if (d.banner) state.banner = d.banner;
      if (d.bannerGradient) state.bannerGradient = {...state.bannerGradient, ...d.bannerGradient};
      if (d.status) state.status = d.status;
      if (Array.isArray(d.friends)) state.friends = d.friends;
      if (Array.isArray(d.dmList)) state.dmList = d.dmList;
      if (Array.isArray(d.myStickers)) state.myStickers = d.myStickers;
      save();
      if (typeof identity === 'function') identity();
      if (typeof renderFriendsView === 'function') renderFriendsView();
      if (typeof renderDmList === 'function') renderDmList();
      return true;
    }
  } catch(e){ console.warn('load', e); }
  return false;
}

// ==== Сообщения в каналах ====
window.__sendChannelMessageCloud = async function(channel, msg){
  try { await addDoc(collection(db,'messages',channel,'items'), { author:msg[0], text:msg[1]||'', time:msg[2]||'', img:msg[3]||'', ts: Date.now() }); }
  catch(e){ console.warn('send channel', e); }
};
window.__deleteChannelMessageCloud = async function(channel, idx){ /* локально уже удалили */ };

function subscribeChannel(channel){
  return onSnapshot(
    query(collection(db,'messages',channel,'items'), orderBy('ts','asc')),
    snap=>{
      const msgs = [];
      snap.forEach(d=>{ const x=d.data(); const arr = x.img ? [x.author,x.text||'',x.time||'',x.img] : [x.author,x.text||'',x.time||'']; msgs.push(arr); });
      state.messages[channel] = msgs;
      save();
      if (state.channel === channel) renderChat();
    },
    err=>console.warn('sub', err)
  );
}

// ==== Заявки друзей ====
function startFriendRequestsSubscription(uid){
  if (unsubIncoming) unsubIncoming();
  if (unsubOutgoing) unsubOutgoing();
  unsubIncoming = onSnapshot(collection(db,'friendRequests',uid,'incoming'), snap=>{
    const arr = [];
    snap.forEach(d=>{ arr.push({ fromUid:d.id, ...d.data() }); });
    const prev = (window.__incoming||[]).length;
    window.__incoming = arr;
    if (arr.length > prev && prev >= 0) { if (typeof playSound === 'function') playSound('notify'); }
    if (typeof updateBadges === 'function') updateBadges();
    if (typeof renderFriendsView === 'function' && state.view === 'friends') renderFriendsView();
  });
  unsubOutgoing = onSnapshot(collection(db,'friendRequests',uid,'outgoing'), snap=>{
    const arr = [];
    snap.forEach(d=>{ arr.push({ toUid:d.id, ...d.data() }); });
    window.__outgoing = arr;
    if (typeof updateBadges === 'function') updateBadges();
    if (typeof renderFriendsView === 'function' && state.view === 'friends') renderFriendsView();
  });
}

window.__sendFriendRequestCloud = async function(nick){
  if (!currentUid) return { ok:false, error:'Не авторизован' };
  const target = window.__allUsers[nick.toLowerCase()];
  if (!target) return { ok:false, error:'Пользователь не найден' };
  if (target.uid === currentUid) return { ok:false, error:'Это ты' };
  if (state.friends.some(f=>f.toLowerCase()===nick.toLowerCase())) return { ok:false, error:'Уже друг' };
  try {
    // Моя исходящая
    await setDoc(doc(db,'friendRequests',currentUid,'outgoing',target.uid), {
      toName: target.username, toUid: target.uid, at: Date.now()
    });
    // Его входящая
    await setDoc(doc(db,'friendRequests',target.uid,'incoming',currentUid), {
      fromName: state.username, fromAvatar: state.avatar, fromUid: currentUid, at: Date.now()
    });
    return { ok:true };
  } catch(e){ console.warn('send req', e); return { ok:false, error:'Ошибка сети' }; }
};

window.__acceptFriendCloud = async function(fromUid, fromName){
  if (!currentUid) return { ok:false };
  try {
    // Добавляем друг друга
    const myFriends = [...(state.friends||[])];
    if (!myFriends.some(f=>f.toLowerCase()===fromName.toLowerCase())) myFriends.push(fromName);
    state.friends = myFriends;

    const dmList = [...(state.dmList||[])];
    if (!dmList.some(f=>f.toLowerCase()===fromName.toLowerCase())) dmList.push(fromName);
    state.dmList = dmList;
    save();

    await setDoc(doc(db,'users',currentUid), { friends: state.friends, dmList: state.dmList }, {merge:true});
    // Обновляем его профиль
    const hisSnap = await getDoc(doc(db,'users',fromUid));
    if (hisSnap.exists()) {
      const hisFriends = [...(hisSnap.data().friends||[])];
      if (!hisFriends.some(f=>f.toLowerCase()===state.username.toLowerCase())) hisFriends.push(state.username);
      const hisDm = [...(hisSnap.data().dmList||[])];
      if (!hisDm.some(f=>f.toLowerCase()===state.username.toLowerCase())) hisDm.push(state.username);
      await setDoc(doc(db,'users',fromUid), { friends: hisFriends, dmList: hisDm }, {merge:true});
    }
    // Удаляем заявки
    await deleteDoc(doc(db,'friendRequests',currentUid,'incoming',fromUid));
    await deleteDoc(doc(db,'friendRequests',fromUid,'outgoing',currentUid));

    if (typeof identity === 'function') identity();
    if (typeof renderFriendsView === 'function') renderFriendsView();
    if (typeof renderDmList === 'function') renderDmList();
    return { ok:true };
  } catch(e){ console.warn('accept', e); return { ok:false }; }
};

window.__rejectFriendCloud = async function(fromUid){
  if (!currentUid) return;
  try {
    await deleteDoc(doc(db,'friendRequests',currentUid,'incoming',fromUid));
    await deleteDoc(doc(db,'friendRequests',fromUid,'outgoing',currentUid));
  } catch(e){ console.warn('reject', e); }
};

window.__cancelRequestCloud = async function(toUid){
  if (!currentUid) return;
  try {
    await deleteDoc(doc(db,'friendRequests',currentUid,'outgoing',toUid));
    await deleteDoc(doc(db,'friendRequests',toUid,'incoming',currentUid));
  } catch(e){ console.warn('cancel', e); }
};

// ==== ЛС ====
function subscribeDm(dmId){
  if (dmUnsubs[dmId]) return;
  dmUnsubs[dmId] = onSnapshot(
    query(collection(db,'dms',dmId,'items'), orderBy('ts','asc')),
    snap=>{
      const msgs = [];
      snap.forEach(d=>{ const x=d.data(); const arr = x.img ? [x.author,x.text||'',x.time||'',x.img] : [x.author,x.text||'',x.time||'']; msgs.push(arr); });
      window.__dmMessages[dmId] = msgs;
      if (state.channel === 'dm:'+getOtherFromDm(dmId)) renderChat();
    },
    err=>console.warn('dm sub', err)
  );
}

function getOtherFromDm(dmId){
  // dm_lower1_lower2
  const parts = dmId.slice(3).split('_');
  const me = state.username.toLowerCase();
  const a = parts.slice(0, parts.length-1).join('_');
  const b = parts[parts.length-1];
  return (a.toLowerCase() === me) ? b : a;
}

window.__sendDmCloud = async function(dmId, msg){
  try { await addDoc(collection(db,'dms',dmId,'items'), { author:msg[0], text:msg[1]||'', time:msg[2]||'', img:msg[3]||'', ts: Date.now() }); }
  catch(e){ console.warn('send dm', e); }
};
window.__deleteDmCloud = async function(dmId, idx){};

// ==== AUTH ====
const ALLOWED=['gmail.com','googlemail.com','yandex.ru','ya.ru','mail.ru','inbox.ru','list.ru','bk.ru','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com','protonmail.com','proton.me','zoho.com','gmx.com','aol.com','rambler.ru'];
function okEmail(e){const m=String(e).toLowerCase().match(/^[^\s@]+@([^\s@]+)$/);return m&&ALLOWED.includes(m[1])}
let mode='login',authShown=false,node=null,onboardShown=false;

function showAuth(){
  if(authShown||onboardShown)return;authShown=true;
  node=document.createElement('div');node.className='fb-auth';node.id='fbAuthScreen';
  node.innerHTML=`<div class="fb-card"><h1>L-Chat</h1><p class="sub">Войди или создай аккаунт</p>
<div class="fb-tabs"><button class="active" data-mode="login">Вход</button><button data-mode="register">Регистрация</button></div>
<form id="fbForm"><div class="fb-field"><label>Email</label><input id="fbEmail" type="email" required placeholder="you@example.com"></div>
<div class="fb-field"><label>Пароль</label><input id="fbPassword" type="password" required minlength="6"></div>
<div class="fb-field" id="fbConfirmWrap" style="display:none"><label>Повтори пароль</label><input id="fbConfirm" type="password"></div>
<div class="fb-msg" id="fbMsg"></div><button type="submit" class="fb-btn" id="fbSubmit">Войти</button></form>
<button class="fb-forgot" id="fbForgot">Забыли пароль?</button></div>`;
  document.body.appendChild(node);
  const q=id=>node.querySelector(id);const msg=q('.fb-msg');const submit=q('#fbSubmit');
  node.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;node.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));q('#fbConfirmWrap').style.display=mode==='register'?'block':'none';submit.textContent=mode==='register'?'Создать':'Войти';msg.textContent=''});
  function m(t,ty){msg.textContent=t;msg.className='fb-msg '+ty}
  q('#fbForm').onsubmit=async e=>{e.preventDefault();msg.textContent='';const email=q('#fbEmail').value.trim();const pw=q('#fbPassword').value;if(!okEmail(email))return m('Этот домен почты не разрешён','err');if(mode==='register'&&pw!==q('#fbConfirm').value)return m('Пароли не совпадают','err');submit.disabled=true;submit.textContent='Подожди...';try{if(mode==='register'){const c=await createUserWithEmailAndPassword(auth,email,pw);try{await sendEmailVerification(c.user)}catch(e){}m('Аккаунт создан!','ok')}else{await signInWithEmailAndPassword(auth,email,pw)}}catch(err){submit.disabled=false;submit.textContent=mode==='register'?'Создать':'Войти';m(trErr(err.code),'err')}};
  q('#fbForgot').onclick=async()=>{const e=q('#fbEmail').value.trim();if(!e)return m('Введи email','err');try{await sendPasswordResetEmail(auth,e);m('Письмо отправлено','ok')}catch(err){m(trErr(err.code),'err')}}
}
function hideAuth(){document.getElementById('fbAuthScreen')?.remove();authShown=false;node=null}
function trErr(c){const m={'auth/email-already-in-use':'Этот email уже занят','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль слишком короткий','auth/user-not-found':'Не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/too-many-requests':'Слишком много попыток','auth/network-request-failed':'Ошибка сети','auth/unauthorized-domain':'Домен не разрешён в Firebase'};return m[c]||'Ошибка: '+c}

function showOnboarding(){
  if(onboardShown)return;onboardShown=true;
  const n=document.createElement('div');n.className='fb-auth';n.id='fbOnboard';
  n.innerHTML=`<div class="fb-card"><h1>Настрой свой профиль</h1><p class="sub">Выбери аватарку и ник</p>

  document.body.appendChild(n);

  q('#obAvatar').onclick=()=>q('#obFile').click();

    state.username=v;save();n.remove();onboardShown=false;hideAuth();
    identity();renderChat();renderMembers();renderDmList();
    if(window.__saveProfileCloud)window.__saveProfileCloud();
    if(window.__pushOnline)window.__pushOnline();
    toast('✅ Добро пожаловать, '+v+'!');
  };
}

onAuthStateChanged(auth, async user=>{
  if(user){
    hideAuth();
    window.__currentUser=user;
    currentUid = user.uid;
    const loaded = await loadProfileCloud(user.uid);
    const fresh = !localStorage.getItem('l-chat-onboarded-v2') && !loaded;
    if(fresh){
      localStorage.setItem('l-chat-onboarded-v2','1');
      showOnboarding();
    } else {
      identity();renderMembers();renderDmList();
      if(window.__saveProfileCloud)window.__saveProfileCloud();
      startOnline(user.uid);
      startUsersSubscription();
      startFriendRequestsSubscription(user.uid);
      ['general','gaming','memes','off-topic'].forEach(c=>subscribeChannel(c));
      // подписки на ЛС
      (state.dmList||[]).forEach(name=>{
        subscribeDm(dmId_(state.username, name));
      });
    }
  } else {
    window.__currentUser=null;currentUid=null;
    if(unsubOnline){unsubOnline();unsubOnline=null}
    if(unsubUsers){unsubUsers();unsubUsers=null}
    if(unsubIncoming){unsubIncoming();unsubIncoming=null}
    if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}
    if(pingInterval){clearInterval(pingInterval);pingInterval=null}
    Object.keys(dmUnsubs).forEach(k=>{try{dmUnsubs[k]()}catch(e){}});
    dmUnsubs={};
    showAuth();
  }
});

window.lattyykkLogout=async()=>{
  if (currentUid) { try{ await deleteDoc(doc(db,'online',currentUid)); }catch(e){} }
  signOut(auth);
};

// Подписка на ЛС при открытии нового чата
window.__subscribeDmIfNeeded = function(name){ subscribeDm(dmId_(state.username, name)); };
</script>
</body>
