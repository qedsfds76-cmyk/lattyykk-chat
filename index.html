<script>
const DEFAULT_AVATAR='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5865f2"/><stop offset="100%" stop-color="#8c6dff"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`);
function colorAvatar(c){return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`)}
const AVATAR_PRESETS=[DEFAULT_AVATAR,colorAvatar('#ed4245'),colorAvatar('#faa61a'),colorAvatar('#f0b232'),colorAvatar('#23a55a'),colorAvatar('#1abc9c'),colorAvatar('#00b0f4'),colorAvatar('#5865f2'),colorAvatar('#8c6dff'),colorAvatar('#eb459e'),colorAvatar('#2b2d31'),colorAvatar('#80848e')];
const defaults={channel:'general',view:'chat',mic:true,deaf:false,voiceConnected:false,username:'Новый аккаунт',about:'',avatar:DEFAULT_AVATAR,banner:'',bannerGradient:{c1:'#8c6dff',c2:'#2b1a63',angle:180},status:'online',accent:'#8c6dff',myStickers:[],messages:{general:[],gaming:[],memes:[],'off-topic':[]},friends:[],dmList:[],blocked:[],muted:[],pinned:[],customNames:{}};
function loadState(){let s={};try{s=JSON.parse(localStorage.getItem('l-chat-v2')||'{}')||{}}catch(e){}const m={...defaults,...s};m.messages={...defaults.messages,...(s.messages||{})};['friends','dmList','blocked','muted','pinned','myStickers'].forEach(k=>{m[k]=Array.isArray(s[k])?[...s[k]]:[]});m.avatar=s.avatar||DEFAULT_AVATAR;m.username=s.username||'Новый аккаунт';m.bannerGradient={...defaults.bannerGradient,...(s.bannerGradient||{})};m.customNames=(s.customNames&&typeof s.customNames==='object')?{...s.customNames}:{};return m}
let state=loadState();
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('l-chat-v2',JSON.stringify(state))}catch(e){}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

window.__onlineUsers={};window.__allUsers={};window.__incoming=[];window.__outgoing=[];window.__dmMessages={};window.__currentFriendsTab='all';
let audioCtxSound=null;
function playSound(type){try{if(!audioCtxSound)audioCtxSound=new(window.AudioContext||window.webkitAudioContext)();if(audioCtxSound.state==='suspended')audioCtxSound.resume();const ctx=audioCtxSound,now=ctx.currentTime;function note(f,s,d,v=0.06){const g=ctx.createGain();g.connect(ctx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.008);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,now+s);o.connect(g);o.start(now+s);o.stop(now+s+d)}function slide(f1,f2,s,d,v=0.05){const g=ctx.createGain();g.connect(ctx.destination);g.gain.setValueAtTime(0,now+s);g.gain.linearRampToValueAtTime(v,now+s+0.008);g.gain.exponentialRampToValueAtTime(0.0001,now+s+d);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f1,now+s);o.frequency.exponentialRampToValueAtTime(f2,now+s+d);o.connect(g);o.start(now+s);o.stop(now+s+d)}const t={join:[[659,0,.18,.07],[987,.1,.22,.06]],leave:[[783,0,.16,.06],[523,.09,.2,.06]],star:[[880,0,.09,.05],[1174,.06,.14,.05]],notify:[[880,0,.1,.05],[1100,.08,.15,.05]]};if(t[type])t[type].forEach(a=>note(...a));else if(type==='mute')slide(600,320,0,.1,.07);else if(type==='unmute')slide(500,900,0,.1,.07);else if(type==='deafen')slide(380,200,0,.14,.06);else if(type==='undeafen')slide(220,400,0,.1,.05)}catch(e){}}

function av(name,extra='',override){if(name===state.username||override)return '<div class="avatar '+extra+'"><img src="'+(override||state.avatar)+'"></div>';const ou=window.__onlineUsers[name];if(ou&&ou.avatar)return '<div class="avatar '+extra+'"><img src="'+ou.avatar+'"></div>';const au=window.__allUsers[name.toLowerCase()];if(au&&au.avatar)return '<div class="avatar '+extra+'"><img src="'+au.avatar+'"></div>';return '<div class="avatar '+extra+'">'+(name||'?').slice(0,2).toUpperCase()+'</div>'}

const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.7 1.1 6.6L12 17.7l-5.8 3.1 1.1-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';
function renderChat(){const c=state.channel;const names={general:'общий',gaming:'игры',memes:'мемы','off-topic':'флудилка'};$('topTitle').textContent='# '+(names[c]||c);$('topTopic').textContent='Тема: Общее';const list=state.messages[c]||[];const msgs=list.map((m,i)=>renderMessage(m,i)).join('');$('messages').innerHTML='<div class="welcome"><h2>Добро пожаловать в #'+(names[c]||c)+'</h2><p>Начало беседы</p></div>'+(list.length?msgs:'<p class="status" style="padding:20px 0">Сообщений пока нет.</p>');bindStarHandlers(list);attachContextMenu(c,list);$('messages').scrollTop=$('messages').scrollHeight}

const ALLOWED=['gmail.com','googlemail.com','yandex.ru','ya.ru','mail.ru','inbox.ru','list.ru','bk.ru','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com','protonmail.com','proton.me','zoho.com','gmx.com','aol.com','rambler.ru'];
function okEmail(e){const m=String(e).toLowerCase().match(/^[^\s@]+@([^\s@]+)$/);return m&&ALLOWED.includes(m[1])}
let mode='login',authShown=false,node=null,onboardShown=false;
function showAuth(){if(authShown||onboardShown)return;authShown=true;node=document.createElement('div');node.className='fb-auth';node.id='fbAuthScreen';node.innerHTML=`<div class="fb-card"><h1>L-Chat</h1><p class="sub">Войди или создай аккаунт</p><div class="fb-tabs"><button class="active" data-mode="login">Вход</button><button data-mode="register">Регистрация</button></div><form id="fbForm"><div class="fb-field"><label>Email</label><input id="fbEmail" type="email" required></div><div class="fb-field"><label>Пароль</label><input id="fbPassword" type="password" required minlength="6"></div><div class="fb-field" id="fbConfirmWrap" style="display:none"><label>Повтори пароль</label><input id="fbConfirm" type="password"></div><div class="fb-msg" id="fbMsg"></div><button type="submit" class="fb-btn" id="fbSubmit">Войти</button></form><button class="fb-forgot" id="fbForgot">Забыли пароль?</button></div>`;document.body.appendChild(node);const q=id=>node.querySelector(id),msg=q('.fb-msg'),submit=q('#fbSubmit');node.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;node.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));q('#fbConfirmWrap').style.display=mode==='register'?'block':'none';submit.textContent=mode==='register'?'Создать':'Войти';msg.textContent=''});function m(t,ty){msg.textContent=t;msg.className='fb-msg '+ty}q('#fbForm').onsubmit=async e=>{e.preventDefault();msg.textContent='';const email=q('#fbEmail').value.trim(),pw=q('#fbPassword').value;if(!okEmail(email))return m('Домен не разрешён','err');if(mode==='register'&&pw!==q('#fbConfirm').value)return m('Пароли не совпадают','err');submit.disabled=true;submit.textContent='Подожди...';try{if(mode==='register'){const c=await createUserWithEmailAndPassword(auth,email,pw);try{await sendEmailVerification(c.user)}catch(e){}m('Аккаунт создан!','ok')}else await signInWithEmailAndPassword(auth,email,pw)}catch(err){submit.disabled=false;submit.textContent=mode==='register'?'Создать':'Войти';m(trErr(err.code),'err')}};q('#fbForgot').onclick=async()=>{const e=q('#fbEmail').value.trim();if(!e)return m('Введи email','err');try{await sendPasswordResetEmail(auth,e);m('Письмо отправлено','ok')}catch(err){m(trErr(err.code),'err')}}}
function hideAuth(){document.getElementById('fbAuthScreen')?.remove();authShown=false;node=null}
function trErr(c){const m={'auth/email-already-in-use':'Email занят','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль короткий','auth/user-not-found':'Не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/too-many-requests':'Много попыток','auth/network-request-failed':'Ошибка сети','auth/unauthorized-domain':'Домен не разрешён'};return m[c]||'Ошибка: '+c}
function showOnboarding(){if(onboardShown)return;onboardShown=true;const n=document.createElement('div');n.className='fb-auth';n.id='fbOnboard';n.innerHTML=`<div class="fb-card"><h1>Настрой профиль</h1><p class="sub">Этот ник увидят другие</p><div class="onboard-avatar" id="obAvatar"><img src="${state.avatar}"></div><p class="onboard-hint">Нажми на круг чтобы загрузить</p><input id="obFile" type="file" accept="image/*" hidden><div class="fb-field"><label>Ник (2-20 символов)</label><input id="obName" type="text" value="Новый аккаунт" maxlength="20"></div><div class="fb-msg" id="obMsg"></div><button type="button" class="fb-btn" id="obDone">Продолжить</button></div>`;document.body.appendChild(n);const q=id=>n.querySelector(id);q('#obAvatar').onclick=()=>q('#obFile').click();q('#obFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.avatar=r.result;q('#obAvatar').innerHTML='<img src="'+r.result+'">';save()};r.readAsDataURL(f)};q('#obDone').onclick=async()=>{const v=q('#obName').value.trim(),err=validateUsername(v);if(err){const m=q('#obMsg');m.textContent=err;m.className='fb-msg err';return}state.username=v;save();n.remove();onboardShown=false;hideAuth();identity();renderChat();renderMembers();renderDmList();await pushSelfToUsers();if(window.__pushOnline)window.__pushOnline();toast('✅ Добро пожаловать, '+v+'!')}}
onAuthStateChanged(auth,async user=>{if(user){hideAuth();window.__currentUser=user;currentUid=user.uid;const loaded=await loadProfileCloud(user.uid);const fresh=!localStorage.getItem('l-chat-onboarded-v10')&&!loaded;if(fresh){localStorage.setItem('l-chat-onboarded-v10','1');showOnboarding();startOnline(user.uid);startUsersSubscription();startFriendRequestsSubscription(user.uid)}else{identity();renderMembers();renderDmList();await pushSelfToUsers();startOnline(user.uid);startUsersSubscription();startFriendRequestsSubscription(user.uid);['general','gaming','memes','off-topic'].forEach(c=>subscribeChannel(c));(state.dmList||[]).filter(n=>n.toLowerCase()!==state.username.toLowerCase()).forEach(n=>subscribeDm(dmId_(state.username,n)));const p=getDmWindowPartner();if(p&&p.toLowerCase()!==state.username.toLowerCase())subscribeDm(dmId_(state.username,p))}}else{window.__currentUser=null;currentUid=null;if(unsubOnline){unsubOnline();unsubOnline=null}if(unsubUsers){unsubUsers();unsubUsers=null}if(unsubIncoming){unsubIncoming();unsubIncoming=null}if(unsubOutgoing){unsubOutgoing();unsubOutgoing=null}if(pingInterval){clearInterval(pingInterval);pingInterval=null}Object.keys(dmUnsubs).forEach(k=>{try{dmUnsubs[k]()}catch(e){}});dmUnsubs={};showAuth()}});
window.lattyykkLogout=async()=>{if(currentUid){try{await deleteDoc(doc(db,'online',currentUid))}catch(e){}}signOut(auth)};
</script>
