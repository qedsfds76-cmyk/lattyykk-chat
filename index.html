<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-Chat</title>
<style>
:root{--bg:#0d0f15;--rail:#11131b;--panel:#171a24;--panel2:#1e2230;--panel3:#292e40;--line:#343b50;--text:#f3f5fb;--muted:#9299aa;--accent:#8c6dff;--good:#4ed39b;--danger:#f07191}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.96)}.app{height:100vh;display:grid;grid-template-columns:72px 255px minmax(400px,1fr) 235px;background:radial-gradient(circle at 65% -20%,#49359a44,transparent 32%),var(--bg)}.rail{background:var(--rail);border-right:1px solid #ffffff0d;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px}.brand,.server{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);color:#d6ceff;font-weight:900}.brand{background:linear-gradient(145deg,var(--accent),#3b62dd);color:white;font-size:22px;box-shadow:0 10px 25px #765dff44}.server{border-radius:50%;font-size:15px}.server:hover,.server.active{background:var(--accent);color:#fff;border-radius:15px}.rail hr{width:34px;border:0;border-top:1px solid var(--line)}.rail-spacer{flex:1}.channels{background:var(--panel);border-right:1px solid #ffffff0d;padding:18px 12px;display:flex;flex-direction:column;min-width:0}.workspace{display:flex;justify-content:space-between;padding:0 9px 20px;font-size:13px;font-weight:900;letter-spacing:.1em}.workspace button,.profile-actions button,.top-actions button{background:transparent;color:var(--muted);padding:7px;border-radius:8px}.workspace button:hover,.profile-actions button:hover,.top-actions button:hover{background:var(--panel3);color:#fff}.channel{width:100%;display:flex;gap:10px;align-items:center;background:transparent;color:var(--muted);padding:9px 11px;border-radius:8px;text-align:left;margin:2px 0}.channel:hover,.channel.active{background:var(--panel3);color:#fff}.channel.active{box-shadow:inset 2px 0 var(--accent)}.channel-label{color:#70798c;font-size:10px;font-weight:900;letter-spacing:.14em;margin:17px 9px 7px}.profile{margin-top:auto;background:var(--panel2);border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer}.profile:hover{background:var(--panel3)}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;background:linear-gradient(145deg,#ff9c6a,#ce4f9b);font-weight:900;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover}.profile-info{min-width:0;flex:1}.profile-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{color:var(--muted);font-size:11px}.online:before{content:"";display:inline-block;width:7px;height:7px;background:var(--good);border-radius:50%;margin-right:5px}.profile-actions{display:flex;gap:1px}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #ffffff0d}.topbar h1{margin:0;font-size:16px}.topbar p{margin:2px 0;color:var(--muted);font-size:12px}.top-actions{margin-left:auto;display:flex;gap:4px}.view{display:none;flex:1;min-height:0;overflow:auto}.view.active{display:flex}.chat-view{flex-direction:column}.messages{flex:1;overflow:auto;padding:25px clamp(16px,4vw,55px)}.welcome{padding:20px 0;border-bottom:1px solid #ffffff0d;margin-bottom:10px}.welcome h2{margin:0 0 7px;font-size:28px}.welcome p{margin:0;color:var(--muted)}.message{display:flex;gap:12px;padding:7px;border-radius:9px;position:relative}.message:hover{background:#ffffff08}.message .avatar{width:39px;height:39px}.message-head{display:flex;gap:9px;align-items:baseline}.time{font-size:11px;color:#6d7587}.message-text{margin-top:3px;white-space:pre-wrap;word-break:break-word;color:#dde1ec}.composer-wrap{padding:0 clamp(16px,4vw,55px) 18px}.composer{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid #ffffff0c;border-radius:12px;padding:8px}.composer input{flex:1;background:transparent;border:0;outline:0;padding:10px}.compose{background:transparent;color:var(--muted);font-size:18px;padding:7px}.send,.primary{background:var(--accent);border-radius:9px;color:#fff;padding:9px 13px;font-weight:800}.send{height:38px;width:38px;padding:0}.right{background:var(--panel);border-left:1px solid #ffffff0d;padding:20px 13px;overflow:auto}.right-title{display:flex;justify-content:space-between;color:#778094;font-size:10px;font-weight:900;letter-spacing:.14em;margin:0 8px 10px}.member{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer}.member:hover{background:var(--panel2)}.member .avatar{width:32px;height:32px}.offline{opacity:.45}.toast-stack{position:fixed;z-index:50;right:20px;bottom:20px;display:grid;gap:8px}.toast{background:#272d3bf4;border:1px solid #ffffff1a;border-radius:10px;padding:11px 13px;min-width:240px;box-shadow:0 16px 45px #0008}.hidden{display:none!important}@media(max-width:1100px){.app{grid-template-columns:68px 220px minmax(350px,1fr)}.right{display:none}}@media(max-width:700px){.app{display:block}.rail{position:fixed;bottom:0;left:0;right:0;height:62px;flex-direction:row;justify-content:space-around;padding:8px;z-index:15}.channels{display:none}.main{height:calc(100vh - 62px)}}

/* Voice view */
.voice-view{justify-content:center;padding:30px}
.voice-room{max-width:600px;margin:0 auto;text-align:center;background:linear-gradient(145deg,#272544,#151d2b);border:1px solid #8c6dff55;border-radius:20px;padding:30px;box-shadow:0 25px 70px #05060b77}
.voice-room h2{margin:0 0 6px;font-size:26px}
.vc-status{display:inline-block;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:18px}
.vc-status.connected{background:#4ed39b22;color:#4ed39b;border:1px solid #4ed39b55}
.vc-status.disconnected{background:#f0719122;color:#ffb5c6;border:1px solid #f0719155}
.vc-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.vc-buttons button{padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.vc-join{background:#4ed39b;color:#0d0f15;font-weight:800;padding:14px 32px;font-size:15px;box-shadow:0 6px 24px #4ed39b55;border-radius:12px}
.vc-join:hover{background:#3bc089;box-shadow:0 8px 30px #4ed39b88;transform:translateY(-1px)}
.vc-leave{background:#f07191;color:#fff}
.vc-leave:hover{background:#d85a7a}
.vc-controls{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.vc-controls button{background:#ffffff13;border:1px solid #ffffff22;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:600}
.vc-controls button:hover{background:#ffffff22}
.vc-controls button.on{background:#f07191;border-color:#f07191}
.vc-participants{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:60px}
.vc-part{background:#10131e99;border:1px solid #ffffff0d;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;min-width:220px;width:100%;max-width:340px}
.vc-part .avatar{width:42px;height:42px}

/* Auth */
.fb-auth{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#8c6dff44,transparent 40%),#0d0f15;padding:20px;overflow:auto}
.fb-card{width:min(440px,100%);background:#171a24f2;border:1px solid #ffffff18;border-radius:20px;padding:30px;box-shadow:0 30px 100px #000b}
.fb-card h1{margin:0 0 6px;font-size:24px}.fb-card .sub{color:#9299aa;margin:0 0 22px;font-size:14px}
.fb-tabs{display:flex;gap:6px;margin-bottom:18px}.fb-tabs button{flex:1;border:0;border-radius:9px;padding:11px;background:#292e40;color:#9299aa;cursor:pointer;font-size:14px;font-weight:600}.fb-tabs button.active{background:#8c6dff;color:#fff}
.fb-field{margin-bottom:12px}.fb-field label{display:block;color:#9299aa;font-size:12px;margin-bottom:5px}.fb-field input{width:100%;background:#1e2230;border:1px solid #343b50;border-radius:9px;padding:12px;color:#fff;font-size:14px;outline:none}.fb-field input:focus{border-color:#8c6dff}
.fb-btn{width:100%;border:0;border-radius:9px;padding:12px;background:#8c6dff;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}.fb-msg{min-height:20px;font-size:13px;margin:10px 0;text-align:center}.fb-msg.err{color:#f07191}.fb-msg.ok{color:#4ed39b}.fb-forgot{display:block;text-align:center;color:#8c6dff;font-size:13px;margin-top:12px;cursor:pointer;background:none;border:0;width:100%}

/* Onboarding */
.onboard-avatar{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:20px auto;overflow:hidden;cursor:pointer;position:relative;border:5px solid #2b2d31;box-shadow:0 10px 40px #0008}
.onboard-avatar img{width:100%;height:100%;object-fit:cover}
.onboard-avatar:hover:after{content:"📷 Изменить";position:absolute;inset:0;background:#000a;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:700}
.onboard-hint{color:#9299aa;font-size:12px;text-align:center;margin-bottom:20px}

/* Profile Card */
.dp-modal{position:fixed;inset:0;z-index:2000;background:#070912cc;backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;overflow:auto;animation:fade .15s}
.dp-card{width:min(420px,100%);border-radius:16px;overflow:hidden;box-shadow:0 30px 100px #000c;color:#fff;position:relative;background-size:cover;background-position:center}
.dp-close{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;background:#00000088;color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;border:0}
.dp-close:hover{background:#000000cc}
.dp-banner{height:110px;background:transparent}
.dp-avatar-wrap{margin-top:-60px;padding:0 18px;position:relative;z-index:2;display:flex}
.dp-avatar{width:100px;height:100px;border-radius:50%;border:6px solid transparent;overflow:hidden;display:grid;place-items:center;position:relative;box-shadow:0 6px 24px #000a}
.dp-avatar img{width:100%;height:100%;object-fit:cover}
.dp-status-dot{position:absolute;bottom:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#4ed39b;border:5px solid #232428;box-sizing:border-box}
.dp-info{padding:14px 18px 6px}
.dp-name{font-size:22px;font-weight:800;margin:0;color:#fff;text-shadow:0 2px 8px #0008}
.dp-handle{color:#ffffffcc;font-size:13px;margin:4px 0;text-shadow:0 1px 4px #0006}
.dp-badges{display:flex;gap:6px;margin:8px 0}
.dp-badges span{background:#5865f2;color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;font-weight:700}
.dp-section{border-radius:10px;padding:12px 14px;margin:12px 18px;background:#00000055;backdrop-filter:blur(8px)}
.dp-section-title{color:#ffffffbb;font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.05em;margin-bottom:6px}
.dp-bio{color:#ffffffdd;font-size:13px;line-height:1.4;white-space:pre-wrap}
.dp-actions{padding:8px 18px 18px;display:grid;gap:6px}
.dp-action{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;cursor:pointer;text-align:left;font-weight:500;background:#00000055;backdrop-filter:blur(8px);transition:.15s}
.dp-action:hover{background:#00000088}
.dp-action .arrow{color:#ffffffbb;font-size:16px}
.dp-action .left{display:flex;align-items:center;gap:10px}
.dp-dot{width:12px;height:12px;border-radius:50%;background:#4ed39b}

/* Edit profile */
.dp-edit-header{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid #1e1f22;background:#232428}
.dp-edit-header h2{margin:0;font-size:18px;color:#fff}
.dp-edit-header button{background:#4e5058;color:#fff;border:0;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.dp-edit-body{padding:16px 18px 18px;display:grid;gap:16px;max-height:75vh;overflow:auto;background:#232428;color:#f3f5fb}
.dp-edit-body label{font-size:11px;text-transform:uppercase;color:#b9bbbe;font-weight:800;letter-spacing:.05em;display:block;margin-bottom:6px}
.dp-edit-body input[type=text],.dp-edit-body textarea{width:100%;background:#1e1f22;border:1px solid #111214;border-radius:8px;padding:10px;color:#f3f5fb;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit}
.dp-avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.dp-av-choice{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;display:grid;place-items:center;overflow:hidden;transition:.15s}
.dp-av-choice:hover{transform:scale(1.08)}
.dp-av-choice.selected{border-color:#5865f2;box-shadow:0 0 0 2px #5865f2}
.dp-av-choice img{width:100%;height:100%;object-fit:cover}
.dp-tabs-banner{display:flex;gap:6px;margin-bottom:10px}
.dp-tabs-banner button{background:#2b2d31;border:0;color:#b9bbbe;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.dp-tabs-banner button.active{background:#5865f2;color:#fff}
.dp-banner-preview{height:100px;border-radius:10px;background:#49358c;background-size:cover;background-position:center;margin-bottom:12px;border:1px solid #111214}
.dp-grad-controls{display:grid;gap:10px}
.dp-grad-row{display:flex;align-items:center;gap:10px}
.dp-grad-row>label{flex:0 0 110px;font-size:12px;color:#b9bbbe;font-weight:600;margin:0}
.dp-grad-row input[type=color]{width:48px;height:36px;border:1px solid #111214;background:#1e1f22;border-radius:7px;cursor:pointer;padding:2px}
.dp-grad-row input[type=range]{flex:1;accent-color:#5865f2}
.dp-grad-row select{background:#1e1f22;border:1px solid #111214;color:#f3f5fb;border-radius:7px;padding:7px 10px;font-size:13px}
.dp-grad-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dp-grad-preset{width:44px;height:26px;border-radius:6px;border:2px solid #111214;cursor:pointer}
.dp-save{width:100%;background:#5865f2;color:#fff;border:0;padding:13px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.dp-upload-btn{background:#4e5058;color:#fff;border:0;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
/* Settings */
.st-layout{background:#232428;width:min(760px,100%);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:210px 1fr;min-height:520px;color:#f3f5fb;box-shadow:0 30px 100px #000c}
.st-side{background:#1e1f22;padding:20px 10px;display:flex;flex-direction:column;gap:3px}
.st-side h3{margin:0 10px 14px;font-size:14px;color:#fff}
.stnav{background:transparent;border:0;color:#b9bbbe;text-align:left;padding:10px 12px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.stnav:hover{background:#2b2d31;color:#fff}
.stnav.active{background:#404249;color:#fff}
.stnav.danger{color:#f07191}
.st-main{padding:24px 26px;overflow:auto;max-height:80vh}
.st-main h2{margin:0 0 16px;font-size:18px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #2b2d31;gap:14px}
.st-row label{font-weight:700;color:#fff;font-size:14px}
.st-row small{display:block;color:#9299aa;font-size:11px;margin-top:3px;font-weight:400}
.st-row input[type=text],.st-row select{background:#1e1f22;border:1px solid #111214;border-radius:7px;padding:9px 11px;color:#fff;min-width:220px;outline:none;font-size:13px}
.st-row input[type=color]{width:48px;height:36px;background:#1e1f22;border:1px solid #111214;border-radius:7px;padding:2px;cursor:pointer}
.st-switch{width:44px;height:24px;border-radius:99px;background:#3e4455;padding:3px;cursor:pointer;border:0}
.st-switch.on{background:#5865f2}
.st-switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.st-switch.on:after{transform:translateX(20px)}
.st-primary{background:#5865f2;color:#fff;border:0;padding:11px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.st-layout{grid-template-columns:1fr}.st-side{flex-direction:row;overflow-x:auto;padding:10px}.st-side h3{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><button class="brand" title="L-Chat">L</button><hr><button class="server active" data-view="chat" title="Home">⌂</button><button class="server" data-view="friends" title="Friends">♧</button><button class="server" data-view="voice" title="Voice">◉</button><button class="server" title="Creator">✦</button><button class="server" title="Gaming">G</button><button class="server" title="Music">♫</button><button class="server" title="Add">＋</button><div class="rail-spacer"></div><button class="server" id="railSettings" title="Settings">⚙</button></aside>
<aside class="channels" id="channels"><div class="workspace">L-CHAT <button>⌄</button></div><button class="channel active" data-view="chat">⌂ <span>Home</span></button><button class="channel" data-view="friends">♧ <span>Friends <b id="friendCount">0</b></span></button><button class="channel" data-view="voice">◉ <span>Voice</span></button><div class="channel-label">TEXT CHANNELS</div><button class="channel text active" data-channel="general"># <span>general</span></button><button class="channel text" data-channel="gaming"># <span>gaming</span></button><button class="channel text" data-channel="memes"># <span>memes</span></button><button class="channel text" data-channel="off-topic"># <span>off-topic</span></button><div class="channel-label">VOICE</div><button class="channel voice" data-voice="general">🔊 <span>General</span></button><button class="channel voice" data-voice="gaming">🔊 <span>Gaming</span></button><button class="channel voice" data-voice="chill">🔊 <span>Chill</span></button><div class="profile" id="bottomProfile"><button class="avatar" id="miniAvatar"></button><div class="profile-info"><strong id="miniName">New Account</strong><span class="status online">Online</span></div><div class="profile-actions"><button id="micButton">🎤</button><button id="deafenButton">🎧</button><button id="profileSettings">⚙</button></div></div></aside>
<main class="main"><header class="topbar"><div><h1 id="topTitle"># general</h1><p id="topTopic">Topic: General</p></div><div class="top-actions"><button>🔔</button><button>📌</button><button>👥</button></div></header>
<section class="view chat-view active" id="chatView"><div class="messages" id="messages"></div><div class="composer-wrap"><div class="composer"><button class="compose" id="fileButton">📎</button><input id="messageInput" placeholder="Message #general"><button class="compose" id="emojiButton">☺</button><button class="send" id="sendButton">➤</button><input id="chatFile" type="file" accept="image/*" hidden></div></div></section>
<section class="view" id="friendsView"><div style="padding:30px"><h2>Friends</h2><div style="display:flex;gap:8px"><button class="primary" id="addFriend">＋ Add Friend</button><input id="friendSearch" placeholder="Search" style="background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px"></div><div id="friendsList" style="margin-top:22px"></div></div></section>
<section class="view voice-view" id="voiceView"><div class="voice-room"><h2 id="voiceTitle">🔊 General</h2><div><span class="vc-status disconnected" id="vcStatus">Не подключён</span></div><div class="vc-participants" id="voiceParticipants"></div><div class="vc-controls" id="vcControls" style="display:none"><button id="voiceMuteBtn">🎤 Микрофон</button><button id="voiceDeafenBtn">🎧 Звук</button></div><div class="vc-buttons"><button class="vc-join" id="voiceJoin">🔗 Подключиться</button><button class="vc-leave" id="voiceDisconnect" style="display:none">📞 Отключиться</button></div></div></section>
</main>
<aside class="right" id="userList"><div class="right-title">ONLINE <span id="onlineCount">0</span></div><div id="onlineMembers"></div><div class="right-title" style="margin-top:22px">OFFLINE <span id="offlineCount">0</span></div><div id="offlineMembers"></div></aside>
</div>
<div class="toast-stack" id="toasts"></div>
<div id="modalRoot"></div>
<script>
const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5865f2"/><stop offset="100%" stop-color="#8c6dff"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`);
function colorAvatar(c){return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${c}"/><circle cx="50" cy="38" r="16" fill="#fff" opacity="0.95"/><path d="M20 92 Q20 62 50 62 Q80 62 80 92 Z" fill="#fff" opacity="0.95"/></svg>`)}

// ===== Звуки как в Discord =====
let audioCtxSound=null;
function playSound(type){
  try{
    if(!audioCtxSound)audioCtxSound=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtxSound.state==='suspended')audioCtxSound.resume();
    const ctx=audioCtxSound, now=ctx.currentTime;
    function bell(f1,f2,delay,vol,dur){
      const g=ctx.createGain();g.connect(ctx.destination);
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+dur);
      const o1=ctx.createOscillator();o1.type='sine';o1.frequency.setValueAtTime(f1,now+delay);o1.connect(g);o1.start(now+delay);o1.stop(now+delay+dur);
      const o2=ctx.createOscillator();o2.type='sine';o2.frequency.setValueAtTime(f2,now+delay);o2.connect(g);o2.start(now+delay);o2.stop(now+delay+dur);
    }
    function blip(freq,delay,vol,dur){
      const g=ctx.createGain();g.connect(ctx.destination);
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(vol,now+delay+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,now+delay+dur);
      const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(freq,now+delay);o.connect(g);o.start(now+delay);o.stop(now+delay+dur);
    }
    if(type==='join') bell(587,880,0,0.09,0.4);
    else if(type==='leave') bell(660,440,0,0.08,0.35);
    else if(type==='mute') blip(320,0,0.06,0.1);
    else if(type==='unmute') blip(740,0,0.05,0.1);
    else if(type==='deafen') bell(220,180,0,0.06,0.3);
    else if(type==='undeafen'){blip(600,0,0.05,0.09);blip(800,0.09,0.05,0.09)}
    else if(type==='switch') bell(700,500,0,0.06,0.25);
  }catch(e){}
}

function getCardGradient(){const g=state.bannerGradient;if(state.banner)return '';if(g.type==='radial')return `background:radial-gradient(circle at 50% 0%, ${g.c1} 0%, ${g.c2} 100%);`;return `background:linear-gradient(${g.angle}deg, ${g.c1} 0%, ${g.c1} 25%, ${g.c2} 100%);`}
function getBannerStyle(){const g=state.bannerGradient;if(state.banner)return `background-image:url('${state.banner}');background-size:cover;background-position:center`;if(g.type==='radial')return `background:radial-gradient(circle at 50% 0%,${g.c1},${g.c2})`;return `background:linear-gradient(${g.angle}deg,${g.c1},${g.c2})`}

function send(){const i=$('messageInput');const v=i.value.trim();if(!v)return;state.messages[state.channel]=state.messages[state.channel]||[];state.messages[state.channel].push([state.username,v,new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})]);i.value='';save();renderChat()}
function renderMembers(){const on=[state.username],off=state.friends.filter(n=>n!==state.username);$('onlineCount').textContent=on.length;$('offlineCount').textContent=off.length;$('onlineMembers').innerHTML=on.map(n=>'<div class="member">'+av(n)+'<div><strong>'+esc(n)+'</strong><small>Online</small></div></div>').join('');$('offlineMembers').innerHTML=off.map(n=>'<div class="member offline">'+av(n)+'<div><strong>'+esc(n)+'</strong><small>Offline</small></div></div>').join('')}
function renderFriends(){const q=($('friendSearch').value||'').toLowerCase();$('friendCount').textContent=state.friends.length;$('friendsList').innerHTML=state.friends.length?state.friends.filter(n=>n.toLowerCase().includes(q)).map(n=>'<div style="padding:10px;display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:9px;margin-bottom:6px">'+av(n)+'<strong>'+esc(n)+'</strong></div>').join(''):'<p class="status">Нет друзей. Нажми «Add Friend».</p>'}

function renderVoice(){
  const ch=state.channel[0].toUpperCase()+state.channel.slice(1);
  $('voiceTitle').textContent='🔊 '+ch;
  const s=$('vcStatus');
  s.textContent=state.voiceConnected?'Подключён':'Не подключён';
  s.className='vc-status '+(state.voiceConnected?'connected':'disconnected');
  $('voiceJoin').style.display=state.voiceConnected?'none':'inline-block';
  $('voiceDisconnect').style.display=state.voiceConnected?'inline-block':'none';
  $('vcControls').style.display=state.voiceConnected?'flex':'none';
  if(state.voiceConnected){
    $('voiceParticipants').innerHTML='<div class="vc-part">'+av(state.username)+'<div><strong>'+esc(state.username)+'</strong><div class="status">'+(state.mic?'🎤 Микрофон вкл':'🔇 Мут')+(state.deaf?' · 🎧 Deafen':'')+'</div></div></div>';
  } else {
    $('voiceParticipants').innerHTML='<p style="color:#9299aa;padding:8px">Ты не в канале. Нажми «🔗 Подключиться» ниже.</p>';
  }
  const mb=$('voiceMuteBtn'),db=$('voiceDeafenBtn');
  if(mb){mb.textContent=state.mic?'🎤 Микрофон вкл':'🔇 Мут';mb.className=state.mic?'':'on'}
  if(db){db.textContent=state.deaf?'🎧 Звук выкл':'🎧 Звук вкл';db.className=state.deaf?'on':''}
}

function connectVoice(ch){state.channel=ch;save();setView('voice')}
function joinVoice(){if(state.voiceConnected)return;state.voiceConnected=true;save();playSound('join');renderVoice()}
function disconnect(){if(!state.voiceConnected)return;state.voiceConnected=false;save();playSound('leave');renderVoice();setView('chat')}

  $('stModal').onclick=e=>{if(e.target.id==='stModal')closeModal()};
  document.querySelectorAll('.stnav[data-st]').forEach(b=>b.onclick=()=>openSettings(b.dataset.st));
  $('stLogout').onclick=()=>{closeModal();if(window.lattyykkLogout)window.lattyykkLogout()};
  if(page==='account'){$('stSaveAcc').onclick=()=>{const n=$('stName').value.trim();const err=validateUsername(n);if(err)return toast(err);state.username=n;state.about=$('stBio').value.trim().slice(0,200);save();identity();toast('Аккаунт сохранён')}}
  if(page==='profile'){$('stOpenEdit').onclick=()=>{closeModal();openEditProfile()}}
  if(page==='appearance'){
    $('stDark').onclick=()=>{state.theme='dark';save();applyTheme()};
    $('stLight').onclick=()=>{state.theme='light';save();applyTheme()};
    $('stAccent').oninput=e=>{state.accent=e.target.value;document.documentElement.style.setProperty('--accent',e.target.value);save()};
    $('stCompact').onclick=e=>{state.compact=!state.compact;e.target.classList.toggle('on',state.compact);document.body.classList.toggle('compact',state.compact);save()};
    $('stAnim').onclick=e=>{state.animations=!state.animations;e.target.classList.toggle('on',state.animations);document.body.classList.toggle('no-animations',!state.animations);save()};
    $('stUserlist').onclick=e=>{state.userlist=!state.userlist;e.target.classList.toggle('on',state.userlist);$('userList').style.display=state.userlist?'block':'none';save()};
  }
  if(page==='voice'){
    $('stMic').onclick=e=>{state.mic=!state.mic;e.target.classList.toggle('on',state.mic);$('micButton').textContent=state.mic?'🎤':'🔇';playSound(state.mic?'unmute':'mute');save()};
    $('stDeaf').onclick=e=>{state.deaf=!state.deaf;e.target.classList.toggle('on',state.deaf);$('deafenButton').textContent=state.deaf?'🔇':'🎧';playSound(state.deaf?'deafen':'undeafen');save()};
  }
  if(page==='lang'){$('stLang').onchange=e=>{state.lang=e.target.value;save();toast('Язык: '+e.target.value.toUpperCase())}}
}
function applyTheme(){if(state.theme==='light'){document.documentElement.style.setProperty('--bg','#edf0f6');document.documentElement.style.setProperty('--panel','#fff');document.documentElement.style.setProperty('--panel2','#e8ebf3');document.documentElement.style.setProperty('--text','#171a24');document.documentElement.style.setProperty('--muted','#5f687b')}else{document.documentElement.style.setProperty('--bg','#0d0f15');document.documentElement.style.setProperty('--panel','#171a24');document.documentElement.style.setProperty('--panel2','#1e2230');document.documentElement.style.setProperty('--text','#f3f5fb');document.documentElement.style.setProperty('--muted','#9299aa')}if(state.accent)document.documentElement.style.setProperty('--accent',state.accent);document.body.classList.toggle('compact',state.compact);document.body.classList.toggle('no-animations',!state.animations);if($('userList'))$('userList').style.display=state.userlist?'block':'none'}
function identity(){$('miniName').textContent=state.username;$('miniAvatar').innerHTML='<img src="'+state.avatar+'">';renderMembers()}

document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>setView(x.dataset.view));
document.querySelectorAll('[data-channel]').forEach(x=>x.onclick=()=>{state.channel=x.dataset.channel;save();setView('chat')});
document.querySelectorAll('[data-voice]').forEach(x=>x.onclick=()=>connectVoice(x.dataset.voice));
$('sendButton').onclick=send;$('messageInput').onkeydown=e=>{if(e.key==='Enter')send()};
$('fileButton').onclick=()=>$('chatFile').click();
$('chatFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.messages[state.channel].push([state.username,'Image',new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),r.result]);save();renderChat()};r.readAsDataURL(f)};
$('emojiButton').onclick=()=>{$('messageInput').value+=' ✨';$('messageInput').focus()};
$('micButton').onclick=()=>{state.mic=!state.mic;save();$('micButton').textContent=state.mic?'🎤':'🔇';playSound(state.mic?'unmute':'mute');renderVoice()};
$('deafenButton').onclick=()=>{state.deaf=!state.deaf;save();$('deafenButton').textContent=state.deaf?'🔇':'🎧';playSound(state.deaf?'deafen':'undeafen');renderVoice()};
$('profileSettings').onclick=e=>{e.stopPropagation();openSettings('account')};
$('bottomProfile').onclick=openProfile;
$('railSettings').onclick=()=>openSettings('account');
$('voiceJoin').onclick=()=>joinVoice();
$('voiceDisconnect').onclick=disconnect;
$('voiceMuteBtn').onclick=()=>{state.mic=!state.mic;save();playSound(state.mic?'unmute':'mute');$('micButton').textContent=state.mic?'🎤':'🔇';renderVoice()};
$('voiceDeafenBtn').onclick=()=>{state.deaf=!state.deaf;save();playSound(state.deaf?'deafen':'undeafen');$('deafenButton').textContent=state.deaf?'🔇':'🎧';renderVoice()};
$('addFriend').onclick=()=>{const n=(prompt('Username')||'').trim();if(!n)return;if(n===state.username)return toast('Нельзя добавить себя');if(state.friends.includes(n))return toast('Уже в друзьях');const err=validateUsername(n);if(err)return toast(err);state.friends.push(n);save();renderFriends();renderMembers();toast('Друг добавлен')};
$('friendSearch').oninput=renderFriends;
document.onkeydown=e=>{const a=document.activeElement;const typing=a&&(['INPUT','TEXTAREA','SELECT'].includes(a.tagName)||a.isContentEditable);if(typing)return;if(e.ctrlKey&&e.key===','){e.preventDefault();openSettings()}if(!e.ctrlKey&&e.key.toLowerCase()==='m'){state.mic=!state.mic;save();$('micButton').textContent=state.mic?'🎤':'🔇';playSound(state.mic?'unmute':'mute');renderVoice()}if(!e.ctrlKey&&e.key.toLowerCase()==='d'){state.deaf=!state.deaf;save();$('deafenButton').textContent=state.deaf?'🔇':'🎧';playSound(state.deaf?'deafen':'undeafen');renderVoice()}if(e.key==='Escape')closeModal()};
function init(){applyTheme();identity();renderChat();renderFriends();renderMembers();$('micButton').textContent=state.mic?'🎤':'🔇';$('deafenButton').textContent=state.deaf?'🔇':'🎧';setView('chat')}
init();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAd9pHc6isaZJDpdpbDeDhwygBu48YkxWc",authDomain:"latyykkchat.firebaseapp.com",projectId:"latyykkchat",storageBucket:"latyykkchat.firebasestorage.app",messagingSenderId:"64363134386",appId:"1:64363134386:web:7ba8223c4e1f89dad4b8ab"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);
const ALLOWED=['gmail.com','googlemail.com','yandex.ru','ya.ru','mail.ru','inbox.ru','list.ru','bk.ru','outlook.com','hotmail.com','live.com','yahoo.com','icloud.com','me.com','protonmail.com','proton.me','zoho.com','gmx.com','aol.com','rambler.ru'];
function okEmail(e){const m=String(e).toLowerCase().match(/^[^\s@]+@([^\s@]+)$/);return m&&ALLOWED.includes(m[1])}
let mode='login',authShown=false,node=null,onboardShown=false;
function showAuth(){if(authShown||onboardShown)return;authShown=true;node=document.createElement('div');node.className='fb-auth';node.id='fbAuthScreen';node.innerHTML=`<div class="fb-card"><h1>L-Chat</h1><p class="sub">Войди или создай аккаунт</p>
<div class="fb-tabs"><button class="active" data-mode="login">Вход</button><button data-mode="register">Регистрация</button></div>
<form id="fbForm"><div class="fb-field"><label>Email</label><input id="fbEmail" type="email" required placeholder="you@example.com"></div>
<div class="fb-field"><label>Пароль</label><input id="fbPassword" type="password" required minlength="6"></div>
<div class="fb-field" id="fbConfirmWrap" style="display:none"><label>Повтори пароль</label><input id="fbConfirm" type="password"></div>
<div class="fb-msg" id="fbMsg"></div><button type="submit" class="fb-btn" id="fbSubmit">Войти</button></form>
<button class="fb-forgot" id="fbForgot">Забыли пароль?</button></div>`;document.body.appendChild(node);
const q=id=>node.querySelector(id);const msg=q('.fb-msg');const submit=q('#fbSubmit');
node.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;node.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));q('#fbConfirmWrap').style.display=mode==='register'?'block':'none';submit.textContent=mode==='register'?'Создать':'Войти';msg.textContent=''});
function m(t,ty){msg.textContent=t;msg.className='fb-msg '+ty}
q('#fbForm').onsubmit=async e=>{e.preventDefault();msg.textContent='';const email=q('#fbEmail').value.trim();const pw=q('#fbPassword').value;if(!okEmail(email))return m('Этот домен почты не разрешён','err');if(mode==='register'&&pw!==q('#fbConfirm').value)return m('Пароли не совпадают','err');submit.disabled=true;submit.textContent='Подожди...';try{if(mode==='register'){const c=await createUserWithEmailAndPassword(auth,email,pw);try{await sendEmailVerification(c.user)}catch(e){}m('Аккаунт создан!','ok')}else{await signInWithEmailAndPassword(auth,email,pw)}}catch(err){submit.disabled=false;submit.textContent=mode==='register'?'Создать':'Войти';m(trErr(err.code),'err')}};
q('#fbForgot').onclick=async()=>{const e=q('#fbEmail').value.trim();if(!e)return m('Введи email','err');try{await sendPasswordResetEmail(auth,e);m('Письмо отправлено','ok')}catch(err){m(trErr(err.code),'err')}}}
function hideAuth(){document.getElementById('fbAuthScreen')?.remove();authShown=false;node=null}
function trErr(c){const m={'auth/email-already-in-use':'Этот email уже занят','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль слишком короткий','auth/user-not-found':'Не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/too-many-requests':'Слишком много попыток','auth/network-request-failed':'Ошибка сети','auth/unauthorized-domain':'Домен не разрешён в Firebase'};return m[c]||'Ошибка: '+c}
function showOnboarding(){if(onboardShown)return;onboardShown=true;const n=document.createElement('div');n.className='fb-auth';n.id='fbOnboard';n.innerHTML=`<div class="fb-card"><h1>Настрой свой профиль</h1><p class="sub">Выбери аватарку и ник</p>
<div class="onboard-avatar" id="obAvatar"><img src="${state.avatar}" alt=""></div>
<p class="onboard-hint">Нажми на круг чтобы загрузить свою</p><input id="obFile" type="file" accept="image/*" hidden>
<div class="fb-field"><label>Ник (2-20 символов)</label><input id="obName" type="text" value="New Account" maxlength="20"></div>
<div class="fb-msg" id="obMsg"></div><button type="button" class="fb-btn" id="obDone">Продолжить</button></div>`;
document.body.appendChild(n);const q=id=>n.querySelector(id);
q('#obAvatar').onclick=()=>q('#obFile').click();
q('#obFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.avatar=r.result;q('#obAvatar').innerHTML='<img src="'+r.result+'">';save()};r.readAsDataURL(f)};
q('#obDone').onclick=()=>{const v=q('#obName').value.trim();const err=validateUsername(v);if(err){const m=q('#obMsg');m.textContent=err;m.className='fb-msg err';return}state.username=v;save();n.remove();onboardShown=false;hideAuth();identity();renderChat();renderMembers();toast('Добро пожаловать, '+v+'!')}}
onAuthStateChanged(auth,user=>{if(user){hideAuth();window.__currentUser=user;const fresh=!localStorage.getItem('l-chat-onboarded');if(fresh){localStorage.setItem('l-chat-onboarded','1');showOnboarding()}else{identity();renderMembers()}}else{window.__currentUser=null;showAuth()}});
window.lattyykkLogout=()=>signOut(auth);
</script>
